name: Container runtime validation

on:
  pull_request:
    paths:
      - "php-patch-automation/container/**"
      - "php-patch-automation/docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate example image policy
        run: |
          test -s php-patch-automation/container/README.md
          grep -q "rebuild" php-patch-automation/container/README.md
