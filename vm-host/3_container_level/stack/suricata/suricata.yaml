%YAML 1.1
---
# Applied to /etc/suricata/suricata.yaml
# ${FCOS_INTERFACE} and ${FCOS_LAN_CIDR} are rendered by vm-host/build.sh.
# ET Open rules are fetched by suricata-update into /var/lib/suricata/rules;
# local policy rules live in /etc/suricata/suricata.rules (see rule-files).

vars:
  address-groups:
    HOME_NET: "[${FCOS_LAN_CIDR}]"
    EXTERNAL_NET: "!$HOME_NET"
    HTTP_SERVERS: "$HOME_NET"
    SMTP_SERVERS: "$HOME_NET"
    SQL_SERVERS: "$HOME_NET"
    DNS_SERVERS: "$HOME_NET"
    TELNET_SERVERS: "$HOME_NET"
    AIM_SERVERS: "$EXTERNAL_NET"
    DC_SERVERS: "$HOME_NET"
    DNP3_SERVER: "$HOME_NET"
    DNP3_CLIENT: "$HOME_NET"
    MODBUS_CLIENT: "$HOME_NET"
    MODBUS_SERVER: "$HOME_NET"
    ENIP_CLIENT: "$HOME_NET"
    ENIP_SERVER: "$HOME_NET"
  port-groups:
    HTTP_PORTS: "80"
    SHELLCODE_PORTS: "!80"
    ORACLE_PORTS: 1521
    SSH_PORTS: 22
    DNP3_PORTS: 20000
    MODBUS_PORTS: 502
    FILE_DATA_PORTS: "[$HTTP_PORTS,110,143]"
    FTP_PORTS: 21
    GENEVE_PORTS: 6081
    VXLAN_PORTS: 4789
    TEREDO_PORTS: 3544
    SIP_PORTS: "[5060, 5061]"

default-rule-path: /var/lib/suricata/rules
rule-files:
  # ET Open bundle output lands in default-rule-path as suricata.rules;
  # local policy rules ship with the stack at /etc/suricata/local.rules.
  - suricata.rules
  - /etc/suricata/local.rules

# AF_PACKET IDS capture on the guest NIC (fail-open; see nftables note below
# for the optional NFQUEUE inline-prevention path).
afp-mode: mpsc
default-packet-size: 1514
stream:
  memcap: 256mb
  checksum-validation: yes
  inline: auto
  reassembly:
    memcap: 256mb
    depth: 1mb
detect:
  profile: medium
  custom-values:
    toclient-groups: 3
    toserver-groups: 25
  sgh-mpm-context: auto
  inspection-recursion-limit: 3000
  prefilter:
    default: mpm
  profiling:
    grouping:
      dump-to-disk: false
      rules-profiling: false
outputs:
  - fast:
      enabled: yes
      filename: fast.log
      append: yes
  - eve-log:
      enabled: yes
      filetype: regular
      filename: eve.json
      types:
        - alert:
            payload: yes
            payload-buffer-size: 4kb
            payload-printable: yes
            packet: yes
            metadata: yes
        - http:
            extended: yes
        - dns:
            query: yes
            answer: yes
        - tls:
            extended: yes
        - files:
            force-magic: yes
        - stats:
            totals: yes
            threads: no
            deltas: no
        - flow:
            memcap: 32mb
            hash-size: 65536
            prealloc: 10000
            emergency-recovery: 30
  - stats:
      enabled: yes
      filename: stats.log
      append: yes
      totals: yes
      threads: no
af-packet:
  - interface: ${FCOS_INTERFACE}
    cluster-id: 99
    cluster-type: cluster_flow
    defrag: yes
    use-mmap: yes
logging:
  default-log-level: notice
  outputs:
    - console:
        enabled: yes
    - file:
        enabled: yes
        filename: /var/log/suricata/suricata.log
        level: info
