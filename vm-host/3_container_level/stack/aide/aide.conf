# Applied to /etc/aide/aide.conf inside the aide container.
# The host filesystem is mounted read-only at /host — all monitored paths
# carry the /host prefix. Database + reports live on bind-mounted host dirs
# so the baseline persists between the init job and daily checks.
# AIDE >= 0.17 syntax: database_in (not database), log_level/report_level.
database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
log_level=5
report_level=5
report_url=file:/var/log/aide/aide-report.log
gzip_dbout=yes

# Rule definitions — universally supported check letters only.
NORMAL = p+i+n+u+g+s+m+c+md5+sha256
PERMS  = p+u+g+s+m+c
L      = p+i+n+u+g+s+m+c+sha256

# Host paths under the /host mount. Container-internal paths (/proc, /sys,
# /run of the container itself) are not scanned; /host/proc etc. resolve to
# the host's own virtual filesystems and are excluded by not being listed.
/host/boot             NORMAL
/host/etc              NORMAL
/host/usr/bin           PERMS
/host/usr/sbin          PERMS
/host/usr/lib           PERMS
/host/usr/lib64         PERMS
/host/etc/passwd        L
/host/etc/group         L
/host/etc/shadow        L
/host/etc/gshadow       L
/host/etc/ssh           L
/host/etc/sudoers       L
/host/etc/firewalld     L
/host/etc/suricata      L
/host/etc/aide          L
/host/etc/clamav        L
/host/etc/zincati       L
/host/etc/systemd       L
/host/etc/vm-host       L
