# 3_container_level/kasm/docker-compose.yaml
# Standalone KasmVNC workspace container.
#
# NOTE: this runs a single Kasm workspace image directly (KasmVNC on :6901).
# It is NOT the full Kasm Workspaces server (manager/guac/database), which is
# installed by the upstream Kasm installer, not compose. If you need the full
# server, replace this file with the stack generated by install.sh.
#
# Image: kasmweb workspace images are the same ones the Kasm server launches.
services:
  kasm-workspace:
    image: ${KASM_IMAGE:-docker.io/kasmweb/ubuntu-noble-desktop:1.17.0}
    container_name: kasm-workspace
    restart: unless-stopped
    shm_size: "1g"          # browser/desktop apps need shared memory
    environment:
      - VNC_PW=${KASM_VNC_PASSWORD:-}        # KasmVNC password (set in /etc/kasm/env or .env)
      - RESOLUTION=${KASM_RESOLUTION:-1920x1080}
      - USER_ID=${KASM_UID:-1000}
      - GROUP_ID=${KASM_GID:-1000}
    ports:
      - "${KASM_BIND_ADDR:-0.0.0.0}:6901:6901"   # KasmVNC HTTPS
    volumes:
      - kasm_home:/home/kasm-user
      - kasm_profile:/home/kasm-user/.config
    security_opt:
      - seccomp=unconfined        # required by some desktop apps
    cap_add:
      - IPC_LOCK

volumes:
  kasm_home:
  kasm_profile:
