# Applied to /etc/aide/aide.conf — AIDE file-integrity baseline rules.
# Database is initialized once by security-finalize (aide --init) and
# checked daily by aide-daily.timer.
database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
verbose=5
report_url=file:/var/log/aide/aide-report.log
gzip_dbout=yes

# Rule definitions (compact but effective set)
NORMAL = p+i+n+u+g+s+m+c+md5+sha256
d = a+i+n+u+g+s+m+c+md5+sha256
L = p+i+n+u+g+s+m+c+md5+sha256+S+acl+selinux+xattrs+e CAPS

# Directories to monitor
/boot             NORMAL
/etc              PERMS
!/etc/mtab
!/etc/resolv.conf
!/etc/aliases.db
!/etc/adjtime
!/etc/random-seed
!/var/lib/qemu
!/var/lib/libvirt/images
!/var/log
!/run
!/sys
!/proc
!/dev
!/tmp
!/var/tmp
/usr/bin           PERMS
/usr/sbin          PERMS
/bin              PERMS
/sbin             PERMS
/lib               PERMS
/lib64             PERMS
/etc/passwd        L
/etc/group         L
/etc/shadow        L
/etc/gshadow       L
/etc/ssh           L
/etc/sudoers       L
/etc/firewalld     L
/etc/suricata      L
/etc/aide          L
/etc/clamav        L
/etc/zincati       L
/etc/systemd       L
