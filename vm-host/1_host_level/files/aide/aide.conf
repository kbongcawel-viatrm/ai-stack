# Applied to /etc/aide/aide.conf — AIDE file-integrity baseline rules.
# AIDE >= 0.17 syntax: database_in (not database), log_level/report_level
# (not verbose). Database initialized once by security-finalize
# (aide --init) and checked daily by aide-daily.timer.
database_in=file:/var/lib/aide/aide.db.gz
database_out=file:/var/lib/aide/aide.db.new.gz
log_level=5
report_level=5
report_url=file:/var/log/aide/aide-report.log
gzip_dbout=yes

# Rule definitions — stick to the universally supported check letters;
# acl/selinux/xattrs churn on relabel and aren't worth the noise here.
NORMAL = p+i+n+u+g+s+m+c+md5+sha256
PERMS  = p+u+g+s+m+c
L      = p+i+n+u+g+s+m+c+sha256

# Directories to monitor. /bin, /sbin, /lib, /lib64 are symlinks into /usr
# on FCOS — checking them separately would duplicate or fail, so only the
# real trees are listed. Volatile paths under /etc will report changes;
# that is expected for an integrity baseline.
/boot             NORMAL
/etc              NORMAL
/usr/bin           PERMS
/usr/sbin          PERMS
/usr/lib           PERMS
/usr/lib64         PERMS
/etc/passwd        L
/etc/group         L
/etc/shadow        L
/etc/gshadow       L
/etc/ssh           L
/etc/sudoers       L
/etc/firewalld     L
/etc/suricata      L
/etc/aide          L
/etc/clamav        L
/etc/zincati       L
/etc/systemd       L
