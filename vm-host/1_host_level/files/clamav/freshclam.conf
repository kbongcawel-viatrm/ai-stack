# Applied to /etc/clamav/freshclam.conf
DatabaseDirectory /var/lib/clamav
DatabaseMirror db.local.clamav.net
DatabaseMirror database.clamav.net
Checks 24
ConnectTimeout 30
ReceiveTimeout 30
LogVerbose yes
LogTime yes
LogSyslog yes
# ScriptedUpdates no — FCOS has no /etc/clamav/freshclam.conf.d scripting dir by default
