# Applied to /etc/zincati/config.d/20-maintenance.toml
# Zincati 'periodic' strategy: updates are staged as soon as they are
# available but the node only reboots to finalize them inside the windows
# below. Outside windows, updates sit staged until the next window — active
# Kasm sessions are not interrupted. Times are UTC.
[updates]
strategy = "periodic"

[updates.periodic]
time_zone = "UTC"

# Sunday 02:00-04:00 UTC. Add more [[updates.periodic.window]] blocks or
# adjust days/start_time/length_minutes to taste.
[[updates.periodic.window]]
days = ["Sun"]
start_time = "02:00"
length_minutes = 120
