# --- Network & Port ---
# Termux runs without root, so use an unprivileged port above 1024
Port 8022
AddressFamily inet
# Optional: Restrict to your local LAN subnet or VPN IP (e.g., 192.168.1.50)
ListenAddress 0.0.0.0

# --- Authentication & Access Control ---
# Disable all password and interactive keyboard logins; require SSH keys only
PubkeyAuthentication yes
AuthorizedKeysFile .ssh/authorized_keys
PasswordAuthentication no
PermitEmptyPasswords no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no

# Restrict login strictly to your Termux user (find yours with `whoami`)
# AllowUsers u0_a123

# Block root login (not applicable in Termux, kept for strict compliance)
PermitRootLogin no

# --- Brute-Force & Session Limits ---
LoginGraceTime 30s
MaxAuthTries 3
MaxSessions 3
MaxStartups 3:50:10

# --- Disable Unused Forwarding & Tunneling ---
# Keep X11, agent, and port forwarding off unless explicitly needed
AllowAgentForwarding no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no
X11Forwarding no
PermitUserEnvironment no

# --- Modern Cryptography (Post-Quantum Hybrid & Strong Ciphers) ---
KexAlgorithms sntrup761x25519-sha512@openssh.com,curve25519-sha256,curve25519-sha256@libssh.org
Ciphers chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
MACs hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
HostKeyAlgorithms ssh-ed25519,rsa-sha2-512,rsa-sha2-256

# --- Keep-Alive & Logging ---
ClientAliveInterval 300
ClientAliveCountMax 2
PrintMotd no
PrintLastLog no
Subsystem sftp internal-sftp

