name: Validate diskless-os

on:
  pull_request:
    paths: ["diskless-os/**"]
  push:
    branches: [main]
    paths: ["diskless-os/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck gettext-base

      - name: Validate Butane and embedded service assets
        run: |
          set -Eeuo pipefail
          BUTANE_VERSION="0.23.0"
          curl -fsSL -o "$RUNNER_TEMP/butane" "https://github.com/coreos/butane/releases/download/v${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          chmod +x "$RUNNER_TEMP/butane"

          # Generate an ephemeral key solely for schema validation. The deploy
          # workflow must substitute the protected FCOS_SSH_PUBLIC_KEY secret.
          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/fcos-validation-key"
          export FCOS_SSH_PUBLIC_KEY="$(cat "$RUNNER_TEMP/fcos-validation-key.pub")"
          envsubst '${FCOS_SSH_PUBLIC_KEY}' < diskless-os/butane/fcos.bu > "$RUNNER_TEMP/fcos.bu"

          "$RUNNER_TEMP/butane" --strict --pretty --output "$RUNNER_TEMP/fcos.ign" "$RUNNER_TEMP/fcos.bu"
          python3 -m json.tool "$RUNNER_TEMP/fcos.ign" >/dev/null

          python3 - "$RUNNER_TEMP/fcos.bu" "$RUNNER_TEMP" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          import yaml

          source = Path(sys.argv[1])
          out = Path(sys.argv[2])
          cfg = yaml.safe_load(source.read_text())
          files = cfg.get("storage", {}).get("files", [])
          for item in files:
              path = item["path"]
              body = item.get("contents", {}).get("inline", "")
              if path.endswith(".xml"):
                  ET.fromstring(body)
              if path.startswith("/usr/local/sbin/"):
                  target = out / Path(path).name
                  target.write_text(body)
                  target.chmod(0o700)
          print(f"Validated {len(files)} embedded files; parsed Firewalld XML and extracted service scripts.")
          PY

          for script in "$RUNNER_TEMP"/fcos-services-preflight "$RUNNER_TEMP"/suricata-prepare "$RUNNER_TEMP"/clamav-daily-scan "$RUNNER_TEMP"/lynis-daily-audit "$RUNNER_TEMP"/aide-daily-check "$RUNNER_TEMP"/suricata-rule-refresh; do
            bash -n "$script"
          done

      - name: Validate Alpine host script
        run: |
          set -Eeuo pipefail
          bash -n diskless-os/alpine/scripts/validate-host.sh
          shellcheck diskless-os/alpine/scripts/validate-host.sh

      - name: Parse repository YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = list(Path("diskless-os").rglob("*.yml")) + list(Path("diskless-os").rglob("*.yaml"))
          for path in files:
              yaml.safe_load(path.read_text())
          print(f"Parsed {len(files)} YAML files")
          PY
