name: Validate diskless-os

on:
  pull_request:
    paths: ["diskless-os/**"]
  push:
    branches: [main]
    paths: ["diskless-os/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validators
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck
      - name: Validate Butane
        run: |
          BUTANE_VERSION="0.23.0"
          curl -fsSL -o /tmp/butane "https://github.com/coreos/butane/releases/download/v${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          chmod +x /tmp/butane
          /tmp/butane --strict --pretty --output /tmp/fcos.ign diskless-os/butane/fcos.bu
          python3 -m json.tool /tmp/fcos.ign >/dev/null
      - name: Validate shell script
        run: |
          sh -n diskless-os/alpine/scripts/validate-host.sh
          shellcheck diskless-os/alpine/scripts/validate-host.sh
      - name: Parse YAML examples
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          fs = list(Path("diskless-os").rglob("*.yml")) + list(Path("diskless-os").rglob("*.yaml"))
          for p in fs:
              yaml.safe_load(p.read_text())
          print(f"Parsed {len(fs)} YAML files")
          PY
