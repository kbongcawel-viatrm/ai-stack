# FCOS sshd drop-in. Installed by the ssh Butane fragment to
# /etc/ssh/sshd_config.d/00-local-security.conf.
PubkeyAuthentication yes
AuthenticationMethods publickey
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PermitEmptyPasswords no
PermitRootLogin no
MaxAuthTries 3
LoginGraceTime 30
ClientAliveInterval 300
ClientAliveCountMax 2
X11Forwarding no
AllowAgentForwarding no
PermitUserEnvironment no
AllowTcpForwarding no
GatewayPorts no
PermitTunnel no

# Trusted-LAN break-glass: physical/on-LAN users may authenticate with a
# password (covers initial access before keys are deployed). Sources outside
# these CIDRs remain publickey-only, and root is always denied remote login
# by the global PermitRootLogin no above. 10.1.29.0/24 is the retired lab
# subnet, kept for transitional devices. Match blocks must be last.
Match Address ${FCOS_LAN_CIDR},10.1.29.0/24
    AuthenticationMethods any
    PasswordAuthentication yes
    KbdInteractiveAuthentication yes
