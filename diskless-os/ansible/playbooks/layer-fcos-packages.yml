---
- name: Layer FCOS security and Compose packages
  hosts: fcos
  become: true
  gather_facts: false
  vars:
    fcos_layered_packages:
      - python3
      - firewalld
      - nftables
      - suricata
      - aide
      - clamav
      - clamav-freshclam
      - lynis
      - podman-compose
      - logrotate
  tasks:
    # FCOS ships without Python, so every task up to the reboot must use raw
    # (SSH exec, no module interpreter). python3 lands via rpm-ostree below.
    - name: Confirm target is rpm-ostree based Fedora CoreOS
      ansible.builtin.raw: rpm-ostree status
      register: ostree_status
      changed_when: false
      failed_when: ostree_status.rc != 0

    - name: Refuse to layer FCOS packages on a non-CoreOS host
      ansible.builtin.raw: grep -q 'VARIANT="CoreOS"' /etc/os-release
      changed_when: false
      register: coreos_check
      failed_when: coreos_check.rc != 0

    - name: Stage required FCOS packages
      ansible.builtin.raw: "rpm-ostree install {{ fcos_layered_packages | join(' ') }}"
      register: package_layer
      changed_when: "'Changes staged' in package_layer.stdout or 'Staged deployment' in package_layer.stdout"

    - name: Reboot into the package deployment
      ansible.builtin.raw: systemctl reboot
      when: package_layer.changed

    - name: Wait for FCOS SSH after package deployment
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        delay: 15
        sleep: 10
        timeout: 900
      when: package_layer.changed

    - name: Verify required binaries after layering
      ansible.builtin.shell: |
        set -Eeuo pipefail
        for binary in python3 firewall-cmd nft suricata suricata-update aide clamscan freshclam lynis podman podman-compose; do
          command -v "$binary" >/dev/null || {
            echo "Missing after package layering: $binary" >&2
            exit 1
          }
        done
      args:
        executable: /bin/bash
      changed_when: false
