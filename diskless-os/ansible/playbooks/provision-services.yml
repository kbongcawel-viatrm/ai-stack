---
- name: Provision FCOS services and rootless container runtime
  hosts: fcos
  become: true
  gather_facts: true

  vars:
    fcos_user: core
    fcos_lan_ip: 192.168.1.20
    fcos_lan_cidr: 192.168.1.0/24
    fcos_interface: enp1s0
    fcos_layered_packages:
      - firewalld
      - nftables
      - suricata
      - aide
      - clamav
      - clamav-freshclam
      - lynis
      - podman-compose
    aide_enable_daily_timer: false
    suricata_enable_update_timer: true
    layer_packages: true
    container_smoke_image: docker.io/library/alpine:3.24.4

  tasks:
    - name: Validate the FCOS host and network contract
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == "Fedora"
          - ansible_facts.os_family == "RedHat"
          - ansible_facts.default_ipv4.address == fcos_lan_ip
          - fcos_lan_cidr == "192.168.1.0/24"
          - fcos_interface == "enp1s0"
        fail_msg: >-
          This Butane profile expects FCOS at 192.168.1.20 on enp1s0,
          with HOME_NET 192.168.1.0/24. Change the Butane network/firewall
          configuration and inventory together before using another address.

    - name: Check required RPMs in the active FCOS deployment
      ansible.builtin.command:
        argv: [rpm, -q, "{{ item }}"]
      loop: "{{ fcos_layered_packages }}"
      register: fcos_package_checks
      changed_when: false
      when: layer_packages | bool
      failed_when: false

    - name: Calculate missing packages
      ansible.builtin.set_fact:
        fcos_missing_packages: >-
          {{
            fcos_package_checks.results
            | selectattr('rc', 'ne', 0)
            | map(attribute='item')
            | list
          }}

    - name: Layer required RPMs
      ansible.builtin.command:
        argv: "{{ ['rpm-ostree', 'install'] + fcos_missing_packages }}"
      when: layer_packages | bool and fcos_missing_packages | length > 0
      register: fcos_layer_result
      changed_when: true

    - name: Reboot into the layered FCOS deployment
      ansible.builtin.reboot:
        reboot_timeout: 1200
        connect_timeout: 10
        post_reboot_delay: 20
      when: layer_packages | bool and fcos_missing_packages | length > 0

    - name: Reload systemd unit definitions
      ansible.builtin.systemd:
        daemon_reload: true

    - name: Run Butane-installed package preflight
      ansible.builtin.systemd:
        name: fcos-services-preflight.service
        enabled: true
        state: restarted

    - name: Ensure Firewalld is active
      ansible.builtin.systemd:
        name: firewalld.service
        enabled: true
        state: started

    - name: Reload Firewalld XML written by Butane
      ansible.builtin.command: firewall-cmd --reload
      changed_when: true

    - name: Verify enp1s0 is assigned to the public zone
      ansible.builtin.command:
        argv: [firewall-cmd, --get-zone-of-interface, "{{ fcos_interface }}"]
      register: fcos_firewalld_zone
      changed_when: false
      failed_when: fcos_firewalld_zone.stdout != "public"

    - name: Verify inbound public zone target is DROP
      ansible.builtin.command:
        argv: [firewall-cmd, --zone=public, --get-target]
      register: fcos_inbound_target
      changed_when: false
      failed_when: fcos_inbound_target.stdout != "DROP"

    - name: Verify LAN-only SSH exception
      ansible.builtin.command:
        argv: [firewall-cmd, --zone=public, --list-rich-rules]
      register: fcos_ssh_rich_rules
      changed_when: false
      failed_when: >-
        fcos_lan_cidr not in fcos_ssh_rich_rules.stdout or
        "service name=\"ssh\"" not in fcos_ssh_rich_rules.stdout

    - name: Verify source-bound host egress policy
      ansible.builtin.command:
        argv: [firewall-cmd, --info-policy, fcos-host-egress]
      register: fcos_egress_policy
      changed_when: false
      failed_when: >-
        fcos_lan_ip not in fcos_egress_policy.stdout or
        "HOST" not in fcos_egress_policy.stdout or
        "ANY" not in fcos_egress_policy.stdout

    - name: Start NFQUEUE nftables hooks
      ansible.builtin.systemd:
        name: suricata-nfq-rules.service
        enabled: true
        state: restarted

    - name: Enable rootless Podman linger and user socket
      ansible.builtin.systemd:
        name: podman-user-socket-linger.service
        enabled: true
        state: restarted

    - name: Resolve FCOS core user UID
      ansible.builtin.command:
        argv: [id, -u, "{{ fcos_user }}"]
      register: fcos_user_uid
      changed_when: false

    - name: Require UID 1000 because the Butane profile exports that socket
      ansible.builtin.assert:
        that:
          - fcos_user_uid.stdout == "1000"
        fail_msg: >-
          The Butane shell profile is currently configured for UID 1000.
          Update /etc/profile.d/podman-remote.sh and the user-socket configuration
          if the FCOS core account has another UID.

    - name: Verify rootless Podman API
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv:
          - podman
          - --remote
          - --url
          - "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
          - info
          - --format
          - json
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
      register: fcos_podman_info
      changed_when: false

    - name: Assert the API reports rootless mode
      ansible.builtin.assert:
        that:
          - (fcos_podman_info.stdout | from_json).host.security.rootless | bool
          - (fcos_podman_info.stdout | from_json).host.remoteSocket.exists | bool
        fail_msg: "Rootless Podman socket is not reachable or the engine is not rootless."

    - name: Verify interactive Docker alias and API compatibility
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv: [bash, -lic, "docker version"]
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
      changed_when: false

    - name: Verify interactive docker-compose alias
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv: [bash, -lic, "docker-compose version"]
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
      changed_when: false

    - name: Copy the rootless Compose smoke stack
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../services/compose.yaml"
        dest: "/var/home/{{ fcos_user }}/compose.yaml"
        owner: "{{ fcos_user }}"
        group: "{{ fcos_user }}"
        mode: "0640"

    - name: Confirm the podwhitelist-approved smoke image is present
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv:
          - podman
          - --remote
          - --url
          - "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
          - image
          - exists
          - "{{ container_smoke_image }}"
      environment:
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
      register: fcos_smoke_image
      changed_when: false
      failed_when: false

    - name: Require image approval and pull through the existing podwhitelist helper
      ansible.builtin.assert:
        that:
          - fcos_smoke_image.rc == 0
        fail_msg: >-
          {{ container_smoke_image }} is not in the FCOS rootless image store.
          Use the existing podwhitelist helper from the FCOS core user's shell
          to approve and pull this image, then rerun provisioning.

    - name: Exercise rootless Compose and always clean up
      become_user: "{{ fcos_user }}"
      block:
        - name: Start Compose smoke container
          ansible.builtin.command:
            argv:
              - podman-compose
              - -f
              - "/var/home/{{ fcos_user }}/compose.yaml"
              - up
              - -d
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
            CONTAINER_SMOKE_IMAGE: "{{ container_smoke_image }}"
            CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
            DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
          changed_when: true

        - name: Inspect Compose smoke container
          ansible.builtin.command:
            argv:
              - podman
              - --remote
              - --url
              - "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
              - inspect
              - --format
              - json
              - fcos-rootless-compose-smoke
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
            CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
            DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
          register: fcos_compose_inspect
          changed_when: false

        - name: Require the smoke container to be running
          ansible.builtin.assert:
            that:
              - (fcos_compose_inspect.stdout | from_json)[0].State.Status == "running"

      always:
        - name: Remove rootless Compose smoke stack
          ansible.builtin.command:
            argv:
              - podman-compose
              - -f
              - "/var/home/{{ fcos_user }}/compose.yaml"
              - down
          environment:
            XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
            CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
            DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
          failed_when: false
          changed_when: true

    - name: Run Suricata initial source update and configuration test
      ansible.builtin.systemd:
        name: suricata-prepare.service
        state: restarted

    - name: Explicitly test Suricata 8 configuration and FCOS overrides
      ansible.builtin.command:
        argv:
          - suricata
          - -T
          - -c
          - /etc/suricata/suricata.yaml
          - --include
          - /etc/suricata/fcos-overrides.yaml
      changed_when: false

    - name: Enable and start Suricata NFQUEUE IDS/IPS
      ansible.builtin.systemd:
        name: suricata.service
        enabled: true
        state: restarted

    - name: Enable daily ClamAV and Lynis timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - clamav-freshclam-daily.timer
        - clamav-scan.timer
        - lynis-audit.timer

    - name: Enable weekly Suricata ET Open refresh timer
      ansible.builtin.systemd:
        name: suricata-rule-refresh.timer
        enabled: true
        state: started
      when: suricata_enable_update_timer | bool

    - name: Check for a compressed AIDE baseline
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db.gz
      register: fcos_aide_baseline_gz

    - name: Check for an uncompressed AIDE baseline
      ansible.builtin.stat:
        path: /var/lib/aide/aide.db
      register: fcos_aide_baseline

    - name: Require a reviewed AIDE baseline before enabling daily checks
      ansible.builtin.assert:
        that:
          - fcos_aide_baseline_gz.stat.exists or fcos_aide_baseline.stat.exists
        fail_msg: >-
          AIDE baseline is absent. Run initialize-aide.yml, review the baseline,
          then rerun with aide_enable_daily_timer=true.
      when: aide_enable_daily_timer | bool

    - name: Enable AIDE timer only after baseline approval
      ansible.builtin.systemd:
        name: aide-check.timer
        enabled: true
        state: started
      when: aide_enable_daily_timer | bool

    - name: Keep AIDE timer disabled until baseline approval
      ansible.builtin.systemd:
        name: aide-check.timer
        enabled: false
        state: stopped
      when: not (aide_enable_daily_timer | bool)
