---
- name: Validate hypervisor prerequisites
  hosts: hypervisors
  become: true
  gather_facts: false
  tasks:
    - name: Check libvirt daemon
      ansible.builtin.command: virsh uri
      changed_when: false

    - name: Check KVM device
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_device

    - name: Require KVM access
      ansible.builtin.assert:
        that:
          - kvm_device.stat.exists

    - name: Check FCOS domain
      ansible.builtin.command: "virsh dominfo {{ fcos_vm_name | default('fcos-security') }}"
      changed_when: false

- name: Validate FCOS services and rootless Podman
  hosts: fcos
  become: true
  gather_facts: true
  vars:
    podman_socket: unix:///run/user/1000/podman/podman.sock
  tasks:
    - name: Verify expected FCOS address
      ansible.builtin.assert:
        that:
          - ansible_facts.default_ipv4.address == fcos_lan_ip

    - name: Check required services
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - sshd.service
        - firewalld.service
        - suricata-nfq-rules.service
        - suricata.service
      register: fcos_service_states
      changed_when: false

    - name: Assert required services are active
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "Required service {{ item.item }} is not active."
      loop: "{{ fcos_service_states.results }}"

    - name: Check daily and weekly timers
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop:
        - clamav-freshclam-daily.timer
        - clamav-scan.timer
        - lynis-audit.timer
        - suricata-rule-refresh.timer
      register: fcos_timer_states
      changed_when: false

    - name: Assert required timers are active
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "Required timer {{ item.item }} is not active."
      loop: "{{ fcos_timer_states.results }}"

    - name: Verify AIDE timer remains disabled until baseline approval
      ansible.builtin.command: systemctl is-enabled aide-check.timer
      register: aide_timer
      changed_when: false
      failed_when: aide_timer.stdout != "disabled"

    - name: Validate Firewalld policy
      ansible.builtin.command: firewall-cmd --info-policy fcos-host-egress
      register: fcos_egress_policy
      changed_when: false
      failed_when: "'HOST' not in fcos_egress_policy.stdout or 'ANY' not in fcos_egress_policy.stdout"

    - name: Check Suricata configuration
      ansible.builtin.command:
        argv:
          - suricata
          - -T
          - -c
          - /etc/suricata/suricata.yaml
          - --include
          - /etc/suricata/fcos-overrides.yaml
      changed_when: false

    - name: Verify NFQUEUE table exists
      ansible.builtin.command: nft list table inet suricata_nfq
      changed_when: false

    - name: Verify ET Open source is enabled
      ansible.builtin.command: suricata-update list-enabled-sources
      register: enabled_sources
      changed_when: false
      failed_when: "'et/open' not in enabled_sources.stdout"

    - name: Verify scan log directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/log/clamav
        - /var/log/lynis
        - /var/log/aide
        - /var/log/suricata
      register: log_dirs

    - name: Assert scan log directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
      loop: "{{ log_dirs.results }}"

    - name: Verify rootless Podman API
      become: false
      ansible.builtin.command: "podman --remote --url {{ podman_socket }} info --format json"
      environment:
        CONTAINER_HOST: "{{ podman_socket }}"
        XDG_RUNTIME_DIR: /run/user/1000
      register: podman_info_raw
      changed_when: false

    - name: Parse Podman information
      ansible.builtin.set_fact:
        podman_info: "{{ podman_info_raw.stdout | from_json }}"

    - name: Assert rootless Podman mode
      ansible.builtin.assert:
        that:
          - podman_info.host.security.rootless | bool
          - podman_info.host.remoteSocket.exists | bool

    - name: Verify password SSH remains disabled
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false

    - name: Assert SSH authentication policy
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout"
