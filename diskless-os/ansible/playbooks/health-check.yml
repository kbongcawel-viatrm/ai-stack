---
- name: Validate hypervisor prerequisites
  hosts: hypervisors
  become: true
  gather_facts: false
  tasks:
    - name: Check libvirt connection
      ansible.builtin.command:
        argv: [virsh, -c, qemu:///system, uri]
      changed_when: false

    - name: Check KVM device
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_device

    - name: Require KVM access
      ansible.builtin.assert:
        that:
          - kvm_device.stat.exists

    - name: Check FCOS domain
      ansible.builtin.command:
        argv: [virsh, -c, qemu:///system, dominfo, "{{ fcos_vm_name | default('fcos-security') }}"]
      changed_when: false

- name: Validate FCOS security services and rootless Podman
  hosts: fcos
  become: true
  gather_facts: true
  vars:
    fcos_user: core
  tasks:
    - name: Read guest OS identity
      ansible.builtin.command:
        argv: [cat, /etc/os-release]
      register: fcos_os_release
      changed_when: false

    - name: Require actual Fedora CoreOS guest
      ansible.builtin.assert:
        that:
          - fcos_os_release.stdout is search('VARIANT="CoreOS"')
        fail_msg: "The FCOS inventory resolved to a non-CoreOS host."

    - name: Verify expected FCOS guest address
      ansible.builtin.assert:
        that:
          - ansible_facts.default_ipv4.address == fcos_lan_ip

    - name: Check required FCOS services
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - sshd.service
        - firewalld.service
        - fcos-services-preflight.service
        - suricata-nfq-rules.service
        - suricata.service
        - podman-user-socket-linger.service
      register: fcos_service_states
      changed_when: false

    - name: Assert required services are active
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "Required service {{ item.item }} is not active."
      loop: "{{ fcos_service_states.results }}"

    - name: Gather system service facts for bootstrap firewall
      ansible.builtin.service_facts:

    - name: Assert bootstrap firewall is retired after Firewalld activation
      ansible.builtin.assert:
        that:
          - ansible_facts.services['fcos-bootstrap-firewall.service'].state != 'running'
        fail_msg: >-
          Bootstrap nftables firewall is still active. Verify the Firewalld policy
          before retiring the bootstrap firewall.

    - name: Check daily and weekly timers
      ansible.builtin.command:
        argv: [systemctl, is-active, "{{ item }}"]
      loop:
        - clamav-freshclam-daily.timer
        - clamav-scan.timer
        - lynis-audit.timer
        - suricata-rule-refresh.timer
        - logrotate.timer
      register: fcos_timer_states
      changed_when: false

    - name: Assert required timers are active
      ansible.builtin.assert:
        that:
          - item.rc == 0
        fail_msg: "Required timer {{ item.item }} is not active."
      loop: "{{ fcos_timer_states.results }}"

    - name: Check AIDE timer state
      ansible.builtin.command:
        argv: [systemctl, is-enabled, aide-check.timer]
      register: aide_timer
      changed_when: false
      failed_when: false

    - name: Assert AIDE timer state matches baseline approval
      ansible.builtin.assert:
        that:
          - (aide_timer.stdout == "enabled") == (aide_enable_daily_timer | bool)
        fail_msg: >-
          AIDE timer state does not match aide_enable_daily_timer.
          Keep it disabled until the baseline has been initialized and reviewed.

    - name: Validate Firewalld public zone target
      ansible.builtin.command:
        argv: [firewall-cmd, --zone=public, --get-target]
      register: fcos_inbound_target
      changed_when: false
      failed_when: fcos_inbound_target.stdout != "DROP"

    - name: Validate Firewalld LAN SSH exception
      ansible.builtin.command:
        argv: [firewall-cmd, --zone=public, --list-rich-rules]
      register: fcos_ssh_rules
      changed_when: false
      failed_when: >-
        fcos_lan_cidr not in fcos_ssh_rules.stdout or
        "service name=\"ssh\"" not in fcos_ssh_rules.stdout

    - name: Validate source-bound host egress policy
      ansible.builtin.command:
        argv: [firewall-cmd, --info-policy, fcos-host-egress]
      register: fcos_egress_policy
      changed_when: false
      failed_when: >-
        fcos_lan_ip not in fcos_egress_policy.stdout or
        "HOST" not in fcos_egress_policy.stdout or
        "ANY" not in fcos_egress_policy.stdout or
        "http" not in fcos_egress_policy.stdout or
        "https" not in fcos_egress_policy.stdout or
        "80/tcp" not in fcos_egress_policy.stdout or
        "443/tcp" not in fcos_egress_policy.stdout

    - name: Test base Suricata configuration
      ansible.builtin.command:
        argv: [suricata, -T, -c, /etc/suricata/suricata.yaml]
      changed_when: false

    - name: Test Suricata configuration with FCOS overrides
      ansible.builtin.command:
        argv:
          - suricata
          - -T
          - -c
          - /etc/suricata/suricata.yaml
          - --include
          - /etc/suricata/fcos-overrides.yaml
      changed_when: false

    - name: Verify NFQUEUE nftables hooks exist
      ansible.builtin.command:
        argv: [nft, list, table, inet, suricata_nfq]
      changed_when: false

    - name: Verify ET Open source is enabled
      ansible.builtin.command:
        argv: [suricata-update, list-enabled-sources]
      register: enabled_sources
      changed_when: false
      failed_when: "'et/open' not in enabled_sources.stdout"

    - name: Verify scan log directories exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /var/log/clamav
        - /var/log/lynis
        - /var/log/aide
        - /var/log/suricata
      register: log_dirs

    - name: Assert scan log directories
      ansible.builtin.assert:
        that:
          - item.stat.isdir | default(false)
      loop: "{{ log_dirs.results }}"

    - name: Resolve rootless Podman user UID
      ansible.builtin.command:
        argv: [id, -u, "{{ fcos_user }}"]
      register: fcos_user_uid
      changed_when: false

    - name: Verify rootless Podman API
      become: true
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv:
          - podman
          - --remote
          - --url
          - "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
          - info
          - --format
          - json
      environment:
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
      register: podman_info_raw
      changed_when: false

    - name: Parse Podman information
      ansible.builtin.set_fact:
        podman_info: "{{ podman_info_raw.stdout | from_json }}"

    - name: Assert rootless Podman API and socket
      ansible.builtin.assert:
        that:
          - podman_info.host.security.rootless | bool
          - podman_info.host.remoteSocket.exists | bool

    - name: Verify interactive Docker alias
      become: true
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv: [bash, -lic, "docker version"]
      environment:
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
      changed_when: false

    - name: Verify interactive Compose alias
      become: true
      become_user: "{{ fcos_user }}"
      ansible.builtin.command:
        argv: [bash, -lic, "docker-compose version"]
      environment:
        CONTAINER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        DOCKER_HOST: "unix:///run/user/{{ fcos_user_uid.stdout }}/podman/podman.sock"
        XDG_RUNTIME_DIR: "/run/user/{{ fcos_user_uid.stdout }}"
      changed_when: false

    - name: Verify password SSH remains disabled
      ansible.builtin.command: sshd -T
      register: sshd_effective
      changed_when: false

    - name: Assert SSH authentication policy
      ansible.builtin.assert:
        that:
          - "'passwordauthentication no' in sshd_effective.stdout"
          - "'kbdinteractiveauthentication no' in sshd_effective.stdout"
