---
- name: Provision Fedora CoreOS VM on an existing hypervisor
  hosts: hypervisors
  become: true
  gather_facts: true
  vars:
    fcos_vm_name: fcos-kasm-poc
    fcos_vm_memory_mb: 4096
    fcos_vm_vcpus: 2
    fcos_vm_disk_gb: 75
    fcos_network_bridge: br0
    fcos_storage_mountpoint: /mnt/nvme
    fcos_image_dir: "{{ '/mnt/nvme/libvirt/images' if host_os | default('alpine') == 'alpine' else '/var/lib/libvirt/images' }}"
    fcos_domain_dir: "{{ fcos_image_dir }}/domains"
    fcos_ignition_remote_path: "{{ fcos_image_dir }}/ignition/fcos-security.ign"
    fcos_lan_ip: 10.1.29.201
    fcos_qemu_user: qemu
    fcos_qemu_group: qemu
    fcos_qcow2_uncompressed_sha256: ""
    fcos_qcow2_compressed: false
    fcos_qcow2_smb_username: ""
    fcos_qcow2_smb_password: ""
    supported_host_os:
      - alpine
      - secureblue
      - arch
      - ubuntu
  tasks:
    - name: Validate host OS selection and required deployment inputs
      ansible.builtin.assert:
        that:
          - host_os in supported_host_os
          - fcos_qcow2_url is defined
          - fcos_qcow2_sha256 is defined
          - fcos_qcow2_sha256 is match('^[a-fA-F0-9]{64}$')
          - fcos_qcow2_url is not match('^(smb|ftp|ftps)://') or (fcos_qcow2_smb_username | length > 0 and fcos_qcow2_smb_password | length > 0)
          - fcos_ignition_local_path is defined
          - fcos_network_bridge | length > 0
          - fcos_image_dir is defined
          - fcos_image_dir.startswith('/')
          - host_os != "alpine" or (fcos_image_dir != fcos_storage_mountpoint and fcos_image_dir.startswith(fcos_storage_mountpoint.rstrip("/") ~ "/"))
        fail_msg: "Supply a supported host_os, pinned FCOS QCOW2 URL/SHA256, Ignition file and bridge."

    - name: Require persistent storage mount on Alpine diskless hosts
      ansible.builtin.command:
        argv: [mountpoint, -q, "{{ fcos_storage_mountpoint }}"]
      when: host_os == "alpine"
      changed_when: false

    - name: Require Alpine VM storage paths to remain on the persistent mount
      ansible.builtin.assert:
        that:
          - fcos_image_dir.startswith(fcos_storage_mountpoint + "/")
          - fcos_domain_dir.startswith(fcos_storage_mountpoint + "/")
        fail_msg: "Alpine FCOS images and domain XML must be stored under the mounted persistent volume."
      when: host_os == "alpine"

    - name: Verify hypervisor tooling
      ansible.builtin.shell: |
        set -Eeuo pipefail
        for binary in virsh virt-install qemu-img findmnt; do
          command -v "$binary" >/dev/null || {
            echo "Missing hypervisor tool: $binary" >&2
            exit 1
          }
        done
        virsh -c qemu:///system uri
      args:
        executable: /bin/bash
      changed_when: false

    - name: Verify KVM device
      ansible.builtin.stat:
        path: /dev/kvm
      register: kvm_device

    - name: Require KVM device
      ansible.builtin.assert:
        that:
          - kvm_device.stat.exists
        fail_msg: "KVM is unavailable. Prepare the selected host OS and enable virtualization first."

    - name: Verify requested bridge exists
      ansible.builtin.command: "ip link show dev {{ fcos_network_bridge }}"
      changed_when: false

    - name: Check whether the FCOS domain already exists
      ansible.builtin.command: "virsh -c qemu:///system dominfo {{ fcos_vm_name }}"
      register: existing_domain
      changed_when: false
      failed_when: false

    - name: Refuse to overwrite an existing VM
      ansible.builtin.assert:
        that:
          - existing_domain.rc != 0
        fail_msg: >-
          VM {{ fcos_vm_name }} already exists. This playbook never destroys or
          overwrites an existing domain; perform an explicit backup/recovery plan first.

    - name: Create image and Ignition directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - "{{ fcos_image_dir }}"
        - "{{ fcos_image_dir }}/base"
        - "{{ fcos_image_dir }}/ignition"
        - "{{ fcos_domain_dir }}"

    - name: Resolve filesystem backing the FCOS VM storage path
      ansible.builtin.command:
        argv:
          - findmnt
          - -n
          - -o
          - TARGET,FSTYPE
          - --target
          - "{{ fcos_image_dir }}"
      register: fcos_storage_mount
      changed_when: false

    - name: Parse persistent storage mount information
      ansible.builtin.set_fact:
        fcos_storage_mount_target: "{{ fcos_storage_mount.stdout.split()[0] }}"
        fcos_storage_fstype: "{{ fcos_storage_mount.stdout.split()[1] }}"

    - name: Require local persistent storage for VM disks
      ansible.builtin.assert:
        that:
          - fcos_storage_fstype in ["ext4", "xfs", "btrfs", "f2fs"]
        fail_msg: >-
          {{ fcos_image_dir }} resolves to {{ fcos_storage_fstype }} at
          {{ fcos_storage_mount_target }}. FCOS VM disks, Ignition and domain XML must live on local persistent
          ext4, XFS, Btrfs or F2FS storage. Mount the NVMe volume before
          running this workflow; do not use Alpine's diskless rootfs or SMB/NFS.

    - name: Ensure xz decompressor for compressed FCOS image
      ansible.builtin.shell: |
        set -Eeuo pipefail
        if command -v xz >/dev/null 2>&1; then
          exit 0
        fi
        case "{{ host_os }}" in
          alpine) apk add --no-cache xz ;;
          ubuntu) apt-get update && apt-get install -y xz-utils ;;
          arch) pacman -Sy --noconfirm xz ;;
          *) echo "xz is required to decompress the FCOS QCOW2 image; install xz-utils manually." >&2; exit 1 ;;
        esac
        command -v xz >/dev/null
      args:
        executable: /bin/bash
      when: fcos_qcow2_compressed | bool

    - name: Parse NAS QCOW2 source
      ansible.builtin.set_fact:
        fcos_qcow2_nas_host: "{{ fcos_qcow2_url.split('://')[1].split('/')[0].split(':')[0] }}"
        fcos_qcow2_nas_share: "{{ fcos_qcow2_url.split('://')[1].split('/')[1] }}"
        fcos_qcow2_nas_path: "{{ fcos_qcow2_url.split('://')[1].split('/')[2:] | join('/') }}"
      when: fcos_qcow2_url is match('^(smb|ftp|ftps)://')

    - name: Ensure NAS download client
      ansible.builtin.shell: |
        set -Eeuo pipefail
        proto="{{ fcos_qcow2_url.split('://')[0] }}"
        need=""
        case "$proto" in
          smb) need="smbclient" ;;
          ftp|ftps) need="curl" ;;
          *) exit 0 ;;
        esac
        command -v "$need" >/dev/null 2>&1 && exit 0
        case "$need" in
          smbclient)
            case "{{ host_os }}" in
              alpine) apk add --no-cache samba-client ;;
              ubuntu) apt-get update && apt-get install -y smbclient ;;
              arch) pacman -Sy --noconfirm samba ;;
              secureblue) echo "smbclient is missing; layer samba-client via rpm-ostree first." >&2; exit 1 ;;
              *) echo "Install smbclient/samba-client on {{ host_os }}." >&2; exit 1 ;;
            esac ;;
          curl)
            case "{{ host_os }}" in
              alpine) apk add --no-cache curl ;;
              ubuntu) apt-get update && apt-get install -y curl ;;
              arch) pacman -Sy --noconfirm curl ;;
              secureblue) echo "curl is missing; layer curl via rpm-ostree first." >&2; exit 1 ;;
              *) echo "Install curl on {{ host_os }}." >&2; exit 1 ;;
            esac ;;
        esac
        command -v "$need" >/dev/null
      args:
        executable: /bin/bash
      when: fcos_qcow2_url is match('^(smb|ftp|ftps)://')

    - name: Write SMB credentials file
      ansible.builtin.copy:
        dest: /root/.fcos-nas-smb.auth
        content: "username = {{ fcos_qcow2_smb_username }}\npassword = {{ fcos_qcow2_smb_password }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: fcos_qcow2_url is match('^smb://')

    - name: Write FTP credentials file
      ansible.builtin.copy:
        dest: /root/.fcos-nas.netrc
        content: "machine {{ fcos_qcow2_nas_host }}\nlogin {{ fcos_qcow2_smb_username }}\npassword {{ fcos_qcow2_smb_password }}\n"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: fcos_qcow2_url is match('^(ftp|ftps)://')

    - name: Download pinned FCOS base QCOW2
      ansible.builtin.get_url:
        url: "{{ fcos_qcow2_url }}"
        dest: "{{ fcos_image_dir }}/base/{{ 'fcos-base.qcow2.xz' if fcos_qcow2_compressed | bool else 'fcos-base.qcow2' }}"
        checksum: "sha256:{{ fcos_qcow2_sha256 }}"
        owner: root
        group: root
        mode: "0644"
        timeout: 600
      when: fcos_qcow2_url is not match('^(smb|ftp|ftps)://')

    - name: Download FCOS base image from NAS
      ansible.builtin.shell: |
        set -Eeuo pipefail
        dest="{{ fcos_image_dir }}/base/{{ 'fcos-base.qcow2.xz' if fcos_qcow2_compressed | bool else 'fcos-base.qcow2' }}"
        proto="{{ fcos_qcow2_url.split('://')[0] }}"
        case "$proto" in
          smb)
            smbclient "//{{ fcos_qcow2_nas_host }}/{{ fcos_qcow2_nas_share }}" \
              -A /root/.fcos-nas-smb.auth -m SMB3 \
              -c "get {{ fcos_qcow2_nas_path }} {{ dest }}"
            ;;
          ftp|ftps)
            curl -fSL --retry 3 --connect-timeout 15 \
              --netrc-file /root/.fcos-nas.netrc \
              -o "$dest" "{{ fcos_qcow2_url }}"
            ;;
        esac
      args:
        executable: /bin/bash
      when: fcos_qcow2_url is match('^(smb|ftp|ftps)://')

    - name: Verify NAS-downloaded image checksum
      ansible.builtin.stat:
        path: "{{ fcos_image_dir }}/base/{{ 'fcos-base.qcow2.xz' if fcos_qcow2_compressed | bool else 'fcos-base.qcow2' }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: nas_image_checksum
      when: fcos_qcow2_url is match('^(smb|ftp|ftps)://')

    - name: Assert NAS image checksum matches
      ansible.builtin.assert:
        that:
          - nas_image_checksum.stat.checksum == fcos_qcow2_sha256
        fail_msg: "NAS-downloaded FCOS image checksum does not match FCOS_QCOW2_SHA256."
      when: fcos_qcow2_url is match('^(smb|ftp|ftps)://')

    - name: Remove NAS credential files
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/.fcos-nas-smb.auth
        - /root/.fcos-nas.netrc
      when: fcos_qcow2_url is match('^(smb|ftp|ftps)://')

    - name: Decompress FCOS base image
      ansible.builtin.command: "unxz {{ fcos_image_dir }}/base/fcos-base.qcow2.xz"
      when: fcos_qcow2_compressed | bool

    - name: Verify decompressed image checksum
      ansible.builtin.stat:
        path: "{{ fcos_image_dir }}/base/fcos-base.qcow2"
        get_checksum: true
        checksum_algorithm: sha256
      register: base_image_checksum
      when: fcos_qcow2_compressed | bool

    - name: Assert decompressed image checksum
      ansible.builtin.assert:
        that:
          - base_image_checksum.stat.checksum == fcos_qcow2_uncompressed_sha256
        fail_msg: "Decompressed FCOS image checksum does not match the stream metadata."
      when: fcos_qcow2_compressed | bool and fcos_qcow2_uncompressed_sha256 | length > 0

    - name: Verify downloaded image format
      ansible.builtin.command: "qemu-img info --output=json {{ fcos_image_dir }}/base/fcos-base.qcow2"
      register: base_image_info
      changed_when: false

    - name: Assert downloaded image is QCOW2
      ansible.builtin.assert:
        that:
          - (base_image_info.stdout | from_json).format == "qcow2"

    - name: Install rendered Ignition configuration on hypervisor
      ansible.builtin.copy:
        src: "{{ fcos_ignition_local_path }}"
        dest: "{{ fcos_ignition_remote_path }}"
        owner: root
        group: root
        mode: "0644"

    - name: Restore SELinux labels where SELinux is available
      ansible.builtin.shell: |
        if command -v restorecon >/dev/null 2>&1; then
          restorecon -Rv "{{ fcos_image_dir }}"
        fi
      args:
        executable: /bin/bash
      changed_when: true

    - name: Check whether an orphaned overlay disk exists
      ansible.builtin.stat:
        path: "{{ fcos_image_dir }}/{{ fcos_vm_name }}.qcow2"
      register: existing_overlay

    - name: Refuse to reuse an orphaned overlay disk
      ansible.builtin.assert:
        that:
          - not existing_overlay.stat.exists
        fail_msg: "Overlay disk already exists without a matching domain. Inspect and recover it manually."

    - name: Create persistent overlay disk
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - -F
          - qcow2
          - -b
          - "{{ fcos_image_dir }}/base/fcos-base.qcow2"
          - "{{ fcos_image_dir }}/{{ fcos_vm_name }}.qcow2"
          - "{{ fcos_vm_disk_gb }}G"
      args:
        creates: "{{ fcos_image_dir }}/{{ fcos_vm_name }}.qcow2"

    - name: Assign writable overlay disk to the hypervisor QEMU account
      ansible.builtin.file:
        path: "{{ fcos_image_dir }}/{{ fcos_vm_name }}.qcow2"
        owner: "{{ fcos_qemu_user }}"
        group: "{{ fcos_qemu_group }}"
        mode: "0660"

    - name: Restore SELinux label on new overlay disk when using Secureblue
      ansible.builtin.command: "restorecon -F {{ fcos_image_dir }}/{{ fcos_vm_name }}.qcow2"
      when: host_os == "secureblue"
      changed_when: true

    - name: Define and start FCOS VM with Ignition fw_cfg
      ansible.builtin.command:
        argv:
          - virt-install
          - --connect
          - qemu:///system
          - --name
          - "{{ fcos_vm_name }}"
          - --memory
          - "{{ fcos_vm_memory_mb | string }}"
          - --vcpus
          - "{{ fcos_vm_vcpus | string }}"
          - --cpu
          - host-passthrough
          - --import
          - --disk
          - "path={{ fcos_image_dir }}/{{ fcos_vm_name }}.qcow2,format=qcow2,bus=virtio"
          - --network
          - "bridge={{ fcos_network_bridge }},model=virtio"
          - --graphics
          - none
          - --noautoconsole
          - --autostart
          - "--qemu-commandline=-fw_cfg name=opt/com.coreos/config,file={{ fcos_ignition_remote_path }}"
      register: virt_install
      changed_when: true

    - name: Export persistent libvirt domain definition
      ansible.builtin.command:
        argv:
          - virsh
          - -c
          - qemu:///system
          - dumpxml
          - "{{ fcos_vm_name }}"
      register: fcos_domain_xml
      changed_when: false

    - name: Persist domain XML for Alpine diskless reboot recovery
      ansible.builtin.copy:
        content: "{{ fcos_domain_xml.stdout }}\n"
        dest: "{{ fcos_domain_dir }}/{{ fcos_vm_name }}.xml"
        owner: root
        group: root
        mode: "0640"

    - name: Wait for FCOS SSH to become reachable
      ansible.builtin.wait_for:
        host: "{{ fcos_lan_ip }}"
        port: 22
        delay: 15
        sleep: 10
        timeout: 900

    - name: Report VM provisioning result
      ansible.builtin.debug:
        msg:
          - "FCOS VM {{ fcos_vm_name }} is reachable at {{ fcos_lan_ip }}."
          - "Hypervisor OS selected: {{ host_os }}."
          - "Host OS deployment was not invoked; this workflow is independent."
