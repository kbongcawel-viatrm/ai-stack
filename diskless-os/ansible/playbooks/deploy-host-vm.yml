---
- name: Provision Fedora CoreOS VM on an already prepared hypervisor
  hosts: hypervisors
  become: true
  gather_facts: true
  vars:
    fcos_vm_name: fcos-security
    fcos_user: core
    fcos_memory_mib: 5120
    fcos_vcpus: 2
    fcos_disk_gib: 40
    fcos_base_image: /var/lib/libvirt/images/fcos-base.qcow2
    fcos_disk: /var/lib/libvirt/images/fcos-security.qcow2
    fcos_ignition: /var/lib/libvirt/ignition/fcos-security.ign
    libvirt_bridge: br0
    fcos_ssh_public_key: "{{ lookup('env', 'FCOS_SSH_PUBLIC_KEY') }}"
    fcos_vm_ip: 192.168.1.20
    butane_dir: "{{ playbook_dir }}/../../butane"
  tasks:
    - name: Validate host OS selection and supplied image metadata
      ansible.builtin.assert:
        that:
          - host_os in ["alpine", "secureblue", "arch", "ubuntu"]
          - fcos_qcow2_url is defined
          - fcos_qcow2_url is match("^https://")
          - fcos_qcow2_sha256 is defined
          - fcos_qcow2_sha256 is match("^[0-9a-fA-F]{64}$")
          - fcos_ssh_public_key | length > 20
        fail_msg: >-
          The selected hypervisor must already have KVM/QEMU/libvirt configured.
          Set a pinned HTTPS FCOS qcow2 URL, its SHA-256 digest and
          FCOS_SSH_PUBLIC_KEY before running this workflow.
    - name: Confirm KVM and libvirt are already available
      ansible.builtin.command: virsh uri
      changed_when: false
    - name: Confirm KVM device exists
      ansible.builtin.stat:
        path: /dev/kvm
      register: fcos_kvm_device
    - name: Require KVM acceleration
      ansible.builtin.assert:
        that:
          - fcos_kvm_device.stat.exists
        fail_msg: "KVM is unavailable. Prepare virtualization on this host before deploying the VM."
    - name: Confirm the selected bridge exists
      ansible.builtin.command:
        argv: [ip, link, show, dev, "{{ libvirt_bridge }}"]
      changed_when: false
    - name: Check whether the FCOS domain already exists
      ansible.builtin.command:
        argv: [virsh, dominfo, "{{ fcos_vm_name }}"]
      register: fcos_domain_existing
      changed_when: false
      failed_when: false
    - name: Refuse to overwrite an existing FCOS domain
      ansible.builtin.assert:
        that:
          - fcos_domain_existing.rc != 0
        fail_msg: >-
          Domain {{ fcos_vm_name }} already exists. This playbook will not
          overwrite or redefine an existing VM. Use a separate update/rollback
          procedure for an existing domain.
    - name: Create image and Ignition directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: "0750"
      loop:
        - "{{ fcos_base_image | dirname }}"
        - "{{ fcos_ignition | dirname }}"
    - name: Download pinned Fedora CoreOS qcow2 base image
      ansible.builtin.get_url:
        url: "{{ fcos_qcow2_url }}"
        dest: "{{ fcos_base_image }}"
        checksum: "sha256:{{ fcos_qcow2_sha256 }}"
        owner: root
        group: root
        mode: "0640"
        force: false
    - name: Render FCOS user Butane input on the Ansible controller
      ansible.builtin.copy:
        dest: /tmp/fcos-user.bu
        mode: "0600"
        content: "{{ lookup('file', butane_dir + '/fcos-user.bu.in') | replace('$' ~ '{FCOS_SSH_PUBLIC_KEY}', fcos_ssh_public_key) }}"
      delegate_to: localhost
      become: false
    - name: Transpile FCOS user Ignition on the controller
      ansible.builtin.command:
        argv:
          - butane
          - --strict
          - --pretty
          - --output
          - "{{ butane_dir }}/fcos-user.ign"
          - /tmp/fcos-user.bu
      delegate_to: localhost
      become: false
      changed_when: true
    - name: Transpile complete FCOS Butane configuration on the controller
      ansible.builtin.command:
        argv:
          - butane
          - --files-dir
          - "{{ butane_dir }}"
          - --strict
          - --pretty
          - --output
          - "{{ butane_dir }}/fcos.ign"
          - "{{ butane_dir }}/fcos.bu"
      delegate_to: localhost
      become: false
      changed_when: true
    - name: Copy Ignition configuration to hypervisor
      ansible.builtin.copy:
        src: "{{ butane_dir }}/fcos.ign"
        dest: "{{ fcos_ignition }}"
        owner: root
        group: root
        mode: "0600"
    - name: Create a new copy-on-write FCOS VM disk without overwriting existing data
      ansible.builtin.command:
        argv:
          - qemu-img
          - create
          - -f
          - qcow2
          - -F
          - qcow2
          - -b
          - "{{ fcos_base_image }}"
          - "{{ fcos_disk }}"
          - "{{ fcos_disk_gib }}G"
        creates: "{{ fcos_disk }}"
    - name: Verify the VM disk format and backing file
      ansible.builtin.command:
        argv: [qemu-img, info, "{{ fcos_disk }}"]
      register: fcos_disk_info
      changed_when: false
    - name: Define and start FCOS VM with Ignition through QEMU fw_cfg
      ansible.builtin.command:
        argv:
          - virt-install
          - --name
          - "{{ fcos_vm_name }}"
          - --memory
          - "{{ fcos_memory_mib | string }}"
          - --vcpus
          - "{{ fcos_vcpus | string }}"
          - --import
          - --disk
          - "path={{ fcos_disk }},format=qcow2,bus=virtio"
          - --network
          - "bridge={{ libvirt_bridge }},model=virtio"
          - --graphics
          - none
          - --console
          - pty,target_type=serial
          - --osinfo
          - detect=on,require=off
          - --qemu-commandline
          - "-fw_cfg name=opt/com.coreos/config,file={{ fcos_ignition }}"
          - --noautoconsole
      when: fcos_domain_existing.rc != 0
    - name: Wait for FCOS SSH after router DHCP reservation is applied
      ansible.builtin.wait_for:
        host: "{{ fcos_vm_ip }}"
        port: 22
        timeout: 900
        state: started
      delegate_to: localhost
      become: false
    - name: Remove temporary user Butane input from controller
      ansible.builtin.file:
        path: /tmp/fcos-user.bu
        state: absent
      delegate_to: localhost
      become: false
