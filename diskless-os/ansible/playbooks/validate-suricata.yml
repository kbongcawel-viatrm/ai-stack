---
- name: Validate Suricata IDS and IPS behavior through NFQUEUE
  hosts: fcos
  become: true
  gather_facts: false
  vars:
    suricata_test_port: 80
    suricata_test_target: ""
    suricata_local_rules: /var/lib/suricata/rules/local.rules
    suricata_eve_log: /var/log/suricata/eve.json
  tasks:
    - name: Require a separate LAN HTTP test endpoint
      ansible.builtin.assert:
        that:
          - suricata_test_target | length > 0
          - suricata_test_target != ansible_host
        fail_msg: >-
          Set suricata_test_target to a reachable second LAN host serving HTTP.
          IDS/IPS cannot be proven by checking the Suricata process alone.

    - name: Validate the test target is an IPv4 address
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - "import ipaddress,sys; ipaddress.IPv4Address(sys.argv[1])"
          - "{{ suricata_test_target }}"
      changed_when: false

    - name: Save current local rules before temporary test
      ansible.builtin.copy:
        src: "{{ suricata_local_rules }}"
        dest: "{{ suricata_local_rules }}.pre-validation"
        remote_src: true
        mode: "0640"

    - name: Run controlled IDS and IPS tests, then always restore production rules
      block:
        - name: Install temporary IDS and IPS signatures
          ansible.builtin.copy:
            dest: "{{ suricata_local_rules }}"
            mode: "0640"
            content: |
              alert http $HOME_NET any -> $HOME_NET any (msg:"LOCAL IDS validation"; flow:established,to_server; http.uri; content:"/suricata-ids-test"; sid:9900001; rev:1;)
              drop http $HOME_NET any -> $HOME_NET any (msg:"LOCAL IPS drop validation"; flow:established,to_server; http.uri; content:"/suricata-ips-drop-test"; sid:9900002; rev:1;)

        - name: Test Suricata configuration with temporary signatures
          ansible.builtin.command:
            argv: [suricata, -T, -c, /etc/suricata/suricata.yaml]
          changed_when: false

        - name: Restart NFQUEUE engine with temporary signatures
          ansible.builtin.systemd:
            name: suricata-nfq.service
            state: restarted

        - name: Send IDS test request to the second LAN endpoint
          ansible.builtin.command:
            argv:
              - curl
              - --silent
              - --show-error
              - --output
              - /dev/null
              - --connect-timeout
              - "3"
              - --max-time
              - "8"
              - "http://{{ suricata_test_target }}:{{ suricata_test_port }}/suricata-ids-test"
          changed_when: false

        - name: Wait for IDS event in EVE
          ansible.builtin.command:
            argv: [grep, -E, '"signature_id":[[:space:]]*9900001', "{{ suricata_eve_log }}"]
          register: suricata_ids_event
          retries: 5
          delay: 2
          until: suricata_ids_event.rc == 0
          changed_when: false

        - name: Send IPS drop request and require NFQUEUE to time it out
          ansible.builtin.command:
            argv:
              - curl
              - --silent
              - --show-error
              - --output
              - /dev/null
              - --connect-timeout
              - "3"
              - --max-time
              - "5"
              - "http://{{ suricata_test_target }}:{{ suricata_test_port }}/suricata-ips-drop-test"
          register: suricata_ips_request
          changed_when: false
          failed_when: suricata_ips_request.rc != 28

        - name: Wait for IPS drop event in EVE
          ansible.builtin.command:
            argv: [grep, -E, '"signature_id":[[:space:]]*9900002', "{{ suricata_eve_log }}"]
          register: suricata_ips_event
          retries: 5
          delay: 2
          until: suricata_ips_event.rc == 0
          changed_when: false

      always:
        - name: Restore original local rules
          ansible.builtin.copy:
            src: "{{ suricata_local_rules }}.pre-validation"
            dest: "{{ suricata_local_rules }}"
            remote_src: true
            mode: "0640"

        - name: Remove temporary rules backup
          ansible.builtin.file:
            path: "{{ suricata_local_rules }}.pre-validation"
            state: absent

        - name: Validate restored production rules
          ansible.builtin.command:
            argv: [suricata, -T, -c, /etc/suricata/suricata.yaml]
          changed_when: false

        - name: Restart Suricata with restored production rules
          ansible.builtin.systemd:
            name: suricata-nfq.service
            state: restarted
