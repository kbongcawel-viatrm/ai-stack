[defaults]
roles_path = ./roles
inventory = ./inventory.ini
stdout_callback = default
result_format = yaml
forks = 10
timeout = 30
retry_files_enabled = false
host_key_checking = False   # LAN lab; pin FCOS host key via fcos_known_hosts if needed
interpreter_python = auto_silent

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False
