---
# qemu_provisioner — base image, overlay, libvirt domain lifecycle.
# Tag: provision
#
# Requires become (root or run0) for /var/lib/libvirt and virsh qemu:///system.

- name: Assert composer output exists
  ansible.builtin.stat:
    path: "{{ build_dir }}/config.ign"
  register: ignition_stat
  failed_when: not ignition_stat.stat.exists

- name: Ensure image directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ fcos_images_dir }}"
    - "{{ fcos_vm_dir }}"

- name: Check for existing base image
  ansible.builtin.stat:
    path: "{{ fcos_base_image_path }}"
  register: base_image_stat

- name: Download FCOS base image
  ansible.builtin.get_url:
    url: "{{ fcos_base_image_url }}"
    dest: "{{ fcos_base_image_path }}"
    checksum: "{{ fcos_base_image_sha256 | default(omit) }}"
    mode: "0644"
  when: not base_image_stat.stat.exists

- name: Check for existing overlay disk
  ansible.builtin.stat:
    path: "{{ fcos_overlay_path }}"
  register: overlay_stat

- name: Create qcow2 overlay on base image
  ansible.builtin.command: >-
    qemu-img create -f qcow2 -F qcow2
    -b {{ fcos_base_image_path }} -o backing_fmt=qcow2
    {{ fcos_overlay_path }} {{ fcos_vm_disk_size }}
  args:
    creates: "{{ fcos_overlay_path }}"
  register: overlay_create

- name: Stage Ignition config next to overlay
  ansible.builtin.copy:
    src: "{{ build_dir }}/config.ign"
    dest: "{{ fcos_vm_dir }}/config.ign"
    mode: "0644"

- name: Detect first boot (fresh overlay => fw_cfg Ignition)
  ansible.builtin.set_fact:
    fcos_first_boot: "{{ overlay_create is changed }}"

- name: Render libvirt domain XML
  ansible.builtin.template:
    src: domain.xml.j2
    dest: "{{ fcos_vm_dir }}/domain.xml"
    mode: "0644"

- name: Check whether domain already exists
  ansible.builtin.command: >-
    virsh --connect {{ fcos_libvirt_uri }} dominfo {{ fcos_vm_name }}
  register: dominfo
  failed_when: false
  changed_when: false

- name: Define libvirt domain
  ansible.builtin.command: >-
    virsh --connect {{ fcos_libvirt_uri }} define {{ fcos_vm_dir }}/domain.xml
  when: dominfo.rc != 0

- name: Start VM if not running
  ansible.builtin.command: >-
    virsh --connect {{ fcos_libvirt_uri }} start {{ fcos_vm_name }}
  when: >-
    dominfo.rc != 0 or 'State: running' not in dominfo.stdout
  register: vm_start
  failed_when: vm_start.rc != 0 and 'already active' not in (vm_start.stderr ~ vm_start.stdout)
  changed_when: vm_start.rc == 0

- name: Report VM state
  ansible.builtin.command: >-
    virsh --connect {{ fcos_libvirt_uri }} domstate {{ fcos_vm_name }}
  register: domstate
  changed_when: false

- name: Show state
  ansible.builtin.debug:
    msg: "{{ fcos_vm_name }}: {{ domstate.stdout }} (first_boot={{ fcos_first_boot }})"
