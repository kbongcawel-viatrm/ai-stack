# qemu_provisioner — FCOS base image + overlay lifecycle and libvirt domain.
#
# Idempotent: downloads the FCOS stable-stream QCOW2 once, creates a persistent
# qcow2 overlay per VM, and defines/starts a libvirt domain. Ignition is passed
# via QEMU fw_cfg ONLY on first boot of a fresh overlay; reboots of an existing
# overlay reuse the already-applied config.
#
# Runs on the hypervisor (Secureblue) — host-level activity, run0 for privilege.

fcos_vm_name: fcos-kasm-poc
fcos_vm_memory_mb: 8192
fcos_vm_vcpus: 4
fcos_vm_disk_size: 100G
fcos_network_bridge: br0
fcos_vm_mac: ""            # optional; libvirt assigns one when empty
fcos_libvirt_uri: qemu:///system

# Pinned FCOS stable build. Query
# https://builds.coreos.fedoraproject.org/streams/stable/builds/ for current.
fcos_coreos_build: "41.20260201.0.0"
fcos_base_image_url: >-
  https://builds.coreos.fedoraproject.org/streams/stable/builds/{{ fcos_coreos_build }}/x86_64/fedora-coreos-{{ fcos_coreos_build }}-qemu.x86_64.qcow2
fcos_base_image_sha256: ""   # set to enforce checksum verification

fcos_images_dir: /var/lib/libvirt/images
fcos_vm_dir: "{{ fcos_images_dir }}/{{ fcos_vm_name }}"
fcos_base_image_path: "{{ fcos_images_dir }}/fedora-coreos-{{ fcos_coreos_build }}.qcow2"
fcos_overlay_path: "{{ fcos_vm_dir }}/disk.qcow2"
fcos_ignition_path: "{{ build_dir }}/config.ign"   # produced by butane_composer
