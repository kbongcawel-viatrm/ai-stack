# kasm_configurator — post-boot configuration over SSH.
#
# Waits for the FCOS guest, fetches the generated KasmVNC password from
# /var/opt/kasm/.env, and (when kasm_api_enabled) authenticates to a Kasm
# Workspaces API to register infrastructure — e.g. a Windows RDP target as a
# Kasm "Server" (RDP workspaces are Servers, not containers).
#
# Runs against the fcos_vm inventory group as user core.

fcos_wait_timeout: 900
fcos_ssh_retries: 30

# --- credential retrieval (always on) -------------------------------------
kasm_env_path: /var/opt/kasm/.env

# --- upstream Kasm Workspaces API (only for the full-server deployment mode)
kasm_api_enabled: false
kasm_api_scheme: https
kasm_api_port: 443
# Admin credentials for the upstream install (scraped from journald or set
# explicitly). Never commit real values — pass via -e or env lookup.
kasm_admin_user: admin@kasm.local
kasm_admin_password: "{{ lookup('env', 'KASM_ADMIN_PASSWORD') | default('', true) }}"

# Windows RDP target to register as a Kasm Server workspace (optional).
kasm_rdp_host: ""
kasm_rdp_user: ""
kasm_rdp_password: "{{ lookup('env', 'KASM_RDP_PASSWORD') | default('', true) }}"
kasm_rdp_port: 3389
