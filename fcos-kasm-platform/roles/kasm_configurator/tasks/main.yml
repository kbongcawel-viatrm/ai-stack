---
# kasm_configurator — post-boot waits, credential fetch, optional Kasm API.
# Tag: configure

- name: Wait for FCOS guest SSH
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    timeout: "{{ fcos_wait_timeout }}"
  delegate_to: localhost
  become: false

- name: Wait for Kasm stack staging (.env present)
  ansible.builtin.wait_for:
    path: "{{ kasm_env_path }}"
    timeout: "{{ fcos_wait_timeout }}"
  become: false

- name: Fetch generated KasmVNC password
  ansible.builtin.slurp:
    src: "{{ kasm_env_path }}"
  register: kasm_env_slurp
  no_log: true

- name: Parse KASM_VNC_PASSWORD
  ansible.builtin.set_fact:
    kasm_vnc_password: >-
      {{ (kasm_env_slurp.content | b64decode | regex_search('KASM_VNC_PASSWORD=(.*)', '\\1')) | trim }}
  no_log: true

- name: Report Kasm endpoints
  ansible.builtin.debug:
    msg: >-
      KasmVNC endpoints on {{ ansible_host }}:
      ubuntu desktop :6901, librewolf :3101, arch linux :3201.
      VNC password fetched (value suppressed). Full password in {{ kasm_env_path }}.

# --- upstream Kasm Workspaces API (full-server mode only) ------------------
# Standalone KasmVNC containers have no API — this block only runs when
# kasm_api_enabled=true (upstream install.sh deployment).

- name: Scrape admin password from install log (upstream mode)
  ansible.builtin.shell: >-
    journalctl -b -u kasm-install.service --no-pager 2>/dev/null |
    grep -A5 'admin@kasm.local' | grep -oP 'password:\s*\K\S+' | head -1
  register: kasm_admin_scrape
  changed_when: false
  failed_when: false
  when: kasm_api_enabled and kasm_admin_password | length == 0
  no_log: true
  tags: [kasm_api]

- name: Resolve admin credentials
  ansible.builtin.set_fact:
    kasm_admin_password_resolved: >-
      {{ kasm_admin_password if kasm_admin_password | length > 0
         else (kasm_admin_scrape.stdout | default('') | trim) }}
  no_log: true
  when: kasm_api_enabled
  tags: [kasm_api]

- name: Authenticate to Kasm API
  ansible.builtin.uri:
    url: "{{ kasm_api_scheme }}://{{ ansible_host }}:{{ kasm_api_port }}/api/admin/login"
    method: POST
    body_format: json
    body:
      username: "{{ kasm_admin_user }}"
      password: "{{ kasm_admin_password_resolved }}"
    validate_certs: false
    status_code: 200
  register: kasm_login
  no_log: true
  when: >-
    kasm_api_enabled and kasm_rdp_host | length > 0
    and kasm_admin_password_resolved | length > 0
  tags: [kasm_api]

- name: Register Windows RDP target as Kasm Server
  ansible.builtin.uri:
    url: "{{ kasm_api_scheme }}://{{ ansible_host }}:{{ kasm_api_port }}/api/admin/infrastructure/servers"
    method: POST
    headers:
      Authorization: "Bearer {{ kasm_login.json.token }}"
      Content-Type: application/json
    body_format: json
    body:
      friendly_name: "{{ kasm_rdp_host }}"
      hostname: "{{ kasm_rdp_host }}"
      port: "{{ kasm_rdp_port }}"
      username: "{{ kasm_rdp_user }}"
      password: "{{ kasm_rdp_password }}"
    validate_certs: false
    status_code: [200, 201]
  no_log: true
  when: >-
    kasm_api_enabled and kasm_rdp_host | length > 0
    and kasm_admin_password_resolved | length > 0
  tags: [kasm_api]
