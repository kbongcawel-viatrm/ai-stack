---
# butane_composer — render/transpile/merge Butane modules into config.ign.
# Tag: render

- name: Assert render inputs
  ansible.builtin.assert:
    that:
      - enabled_bu_modules is defined and enabled_bu_modules | length > 0
      - fcos_ssh_public_key is defined and fcos_ssh_public_key | length > 0
      - fcos_core_password_hash is defined and fcos_core_password_hash | length > 0
      - rpm_ostree_packages is defined
    fail_msg: >-
      Missing render inputs. fcos_ssh_public_key / fcos_core_password_hash
      default to env vars FCOS_SSH_PUBLIC_KEY / FCOS_CORE_PASSWORD_HASH —
      export them or pass -e overrides.

- name: Locate butane binary
  ansible.builtin.shell: command -v "{{ butane_bin }}" || true
  register: butane_which
  changed_when: false
  tags: render

- name: Resolve butane path
  ansible.builtin.set_fact:
    butane_bin_resolved: >-
      {{ butane_which.stdout | trim if butane_which.stdout | trim | length > 0
         else butane_bin }}
  tags: render

- name: Verify butane binary exists
  ansible.builtin.stat:
    path: "{{ butane_bin_resolved }}"
  register: butane_stat
  failed_when: not butane_stat.stat.exists
  tags: render

- name: Create build tree
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ build_dir }}"
    - "{{ build_dir }}/modules"
    - "{{ build_dir }}/fragments"

- name: Stage enabled module sources
  ansible.builtin.copy:
    src: "{{ platform_root }}/butane_modules/{{ item }}/"
    dest: "{{ build_dir }}/modules/{{ item }}/"
    mode: preserve
  loop: "{{ enabled_bu_modules }}"

- name: Render ${VAR} placeholders in payload files
  ansible.builtin.command: >-
    python3 {{ role_path }}/files/render_vars.py {{ build_dir }}/modules/{{ item }}
  environment: "{{ render_vars_env }}"
  loop: "{{ enabled_bu_modules }}"
  changed_when: "'file(s) updated' in render_vars_result.stdout"
  register: render_vars_result

- name: Template Butane module manifests
  ansible.builtin.template:
    src: "{{ platform_root }}/butane_modules/{{ item }}/{{ item }}.bu.j2"
    dest: "{{ build_dir }}/modules/{{ item }}/{{ item }}.bu"
    mode: "0644"
  loop: "{{ enabled_bu_modules }}"

- name: Transpile module to Ignition fragment
  ansible.builtin.command: >-
    {{ butane_bin_resolved }} --strict --files-dir=. --output={{ build_dir }}/fragments/{{ item }}.ign {{ item }}.bu
  args:
    chdir: "{{ build_dir }}/modules/{{ item }}"
  loop: "{{ enabled_bu_modules }}"

- name: Template merge manifest (root.bu)
  ansible.builtin.template:
    src: root.bu.j2
    dest: "{{ build_dir }}/root.bu"
    mode: "0644"

- name: Transpile merged config to config.ign
  ansible.builtin.command: >-
    {{ butane_bin_resolved }} --strict --files-dir={{ build_dir }} --output={{ build_dir }}/config.ign {{ build_dir }}/root.bu

- name: Validate config.ign is valid JSON
  ansible.builtin.command: python3 -m json.tool {{ build_dir }}/config.ign
  changed_when: false

- name: Report rendered artifact
  ansible.builtin.debug:
    msg: "Rendered {{ build_dir }}/config.ign ({{ enabled_bu_modules | length }} modules merged)"
