---
# group_vars/all.yml — fcos-kasm-platform feature toggles and shared vars.
#
# Each enable_* toggle gates BOTH a butane module (see enabled_bu_modules)
# and its rpm-ostree packages (see rpm_ostree_packages). Keep the two lists
# in sync — the Jinja below is the single place that does it.

# --- feature toggles -------------------------------------------------------
enable_firewalld: true
enable_suricata: true
enable_clamav: true
enable_aide: true
enable_lynis: true
enable_kasm: true          # KasmVNC workspace compose stack
enable_home_security: true # v2.home-security.uk compose stack (inside 30-kasm)

# --- guest network ---------------------------------------------------------
use_static_ip: true
fcos_lan_ip: 192.168.1.201
fcos_lan_cidr: 192.168.1.0/24
fcos_lan_prefix: 24
fcos_gateway: 192.168.1.1
fcos_interface: ens2        # libvirt virtio NIC at PCI slot 0x02 -> ens2

# --- guest identity (secrets via env, never committed) ---------------------
fcos_ssh_public_key: "{{ lookup('env', 'FCOS_SSH_PUBLIC_KEY') }}"
fcos_core_password_hash: "{{ lookup('env', 'FCOS_CORE_PASSWORD_HASH') }}"

# --- shared paths ----------------------------------------------------------
platform_root: "{{ playbook_dir }}"
build_dir: "{{ platform_root }}/build"

# --- derived: enabled butane modules (ordered) ------------------------------
enabled_bu_modules: >-
  {{ ['00-base-system', '10-rpm-ostree']
     + (['20-firewalld'] if enable_firewalld else [])
     + (['21-suricata'] if enable_suricata else [])
     + (['22-clamav'] if enable_clamav else [])
     + (['23-aide'] if enable_aide else [])
     + (['24-ops-monitoring'] if enable_lynis else [])
     + (['30-kasm-workspaces'] if enable_kasm else []) }}

# --- derived: rpm-ostree package set ----------------------------------------
# moby-engine = Fedora's Docker Engine package (there is no 'docker' pkg).
# docker-compose provides the `docker compose` CLI plugin.
rpm_ostree_packages: >-
  {{ ['moby-engine', 'docker-compose']
     + (['firewalld'] if enable_firewalld else [])
     + (['suricata'] if enable_suricata else [])
     + (['clamav', 'clamav-update'] if enable_clamav else [])
     + (['aide'] if enable_aide else [])
     + (['lynis'] if enable_lynis else []) }}
