[hypervisor]
# Run site.yml ON the hypervisor host (Secureblue). ansible_connection=local
# keeps libvirt/qemu-img operations on the host — do NOT point this at
# 'localhost' through a container, /var/lib/libvirt would not be shared.
localhost ansible_connection=local

[fcos_vm]
# The provisioned guest. ansible_host/ansible_user come from
# group_vars/fcos_vm.yml (templated from fcos_lan_ip / fcos_ssh_user).
fcos-kasm
