# 3_container_level/kasm/docker-compose.yaml
# Kasm workspace containers on the FCOS VM host (rootful docker, systemd-managed).
#
# Three browser/desktop workspaces, each self-contained with its own KasmVNC
# (or linuxserver KasmVNC) web endpoint:
#   kasm-workspace   kasmweb Ubuntu desktop  -> https://<vm>:6901
#   kasm-librewolf   LibreWolf browser      -> https://<vm>:3101
#   kasm-linux-os    bolens archlinux XFCE   -> https://<vm>:3201
#
# These are standalone KasmVNC containers — they do NOT need the Kasm
# Workspaces server. If you later deploy the full Kasm platform, these can be
# re-registered as workspace images instead.
#
# linuxserver/bolens images use PUID/PGID + HTTP_PORT/HTTPS_PORT env and
# expose :3000 (http) / :3001 (https) inside the container.
services:
  kasm-workspace:
    image: ${KASM_UBUNTU_IMAGE:-docker.io/kasmweb/ubuntu-noble-desktop:1.19.0}
    container_name: kasm-workspace
    restart: unless-stopped
    shm_size: "1g"
    environment:
      - VNC_PW=${KASM_VNC_PASSWORD:?set KASM_VNC_PASSWORD}
      - RESOLUTION=${KASM_RESOLUTION:-1920x1080}
    ports:
      - "${KASM_BIND_ADDR:-0.0.0.0}:6901:6901"
    volumes:
      - kasm_ubuntu_home:/home/kasm-user
    security_opt:
      - seccomp=unconfined
    cap_add:
      - IPC_LOCK

  kasm-librewolf:
    # LibreWolf (privacy-hardened Firefox) via LinuxServer.io image.
    image: ${KASM_LIBREWOLF_IMAGE:-lscr.io/linuxserver/librewolf:latest}
    container_name: kasm-librewolf
    restart: unless-stopped
    shm_size: "512m"
    environment:
      - PUID=${KASM_UID:-1000}
      - PGID=${KASM_GID:-1000}
      - TZ=${TZ:-UTC}
      - SUBFOLDER=/
      - HTTPS_PORT=3001
    ports:
      - "${KASM_BIND_ADDR:-0.0.0.0}:3101:3001"
    volumes:
      - librewolf_config:/config
    security_opt:
      - seccomp=unconfined

  kasm-linux-os:
    # bolens/kasm-workspace-images — Arch Linux + XFCE (Kasm Linux OS).
    # GHCR: ghcr.io/bolens/kasm-workspace-images/archlinux (also :cachyos, :bazzite)
    image: ${KASM_LINUX_IMAGE:-ghcr.io/bolens/kasm-workspace-images/archlinux:latest}
    container_name: kasm-linux-os
    restart: unless-stopped
    shm_size: "1g"
    environment:
      - PUID=${KASM_UID:-1000}
      - PGID=${KASM_GID:-1000}
      - TZ=${TZ:-UTC}
      - SUBFOLDER=/
      - HTTPS_PORT=3001
    ports:
      - "${KASM_BIND_ADDR:-0.0.0.0}:3201:3001"
    volumes:
      - linuxos_config:/config
    security_opt:
      - seccomp=unconfined

volumes:
  kasm_ubuntu_home:
  librewolf_config:
  linuxos_config:
