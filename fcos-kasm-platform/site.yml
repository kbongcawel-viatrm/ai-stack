---
# fcos-kasm-platform — tag-driven orchestrator.
#
#   ansible-playbook site.yml --tags render      # butane -> build/config.ign
#   ansible-playbook site.yml --tags provision   # qcow2 overlay + libvirt domain
#   ansible-playbook site.yml --tags configure   # post-boot Kasm credential fetch
#   ansible-playbook site.yml                    # all three, in order
#
# Run on the hypervisor host. Required env for render:
#   FCOS_SSH_PUBLIC_KEY, FCOS_CORE_PASSWORD_HASH
# Optional profile override: -e @profiles/<name>.yml

- name: Render Ignition config from butane modules
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - butane_composer
  tags: [render]

- name: Provision FCOS VM on the hypervisor
  hosts: hypervisor
  gather_facts: true
  become: true
  become_method: "{{ hypervisor_become_method | default('run0') }}"
  roles:
    - qemu_provisioner
  tags: [provision]

- name: Configure Kasm stack on the guest (post-boot)
  hosts: fcos_vm
  gather_facts: false
  become: false
  roles:
    - kasm_configurator
  tags: [configure]
