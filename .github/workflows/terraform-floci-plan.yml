name: Terraform Floci plan (BU-12345678901)

on:
  pull_request:
    paths:
      - ".github/workflows/terraform-floci-plan.yml"
      - "terraform/modules/aws/vpc/**"
      - "terraform/modules/aws/ec2/**"
      - "terraform/modules/aws/aurora-serverless/**"
      - "terraform/BU-12345678901/dev/us-east-1/vpc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-floci-bu-12345678901
  cancel-in-progress: true

jobs:
  floci-and-terraform-plan:
    name: Floci stage → Terraform plan stages
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AWS_ACCESS_KEY_ID: "123456789012"
      AWS_SECRET_ACCESS_KEY: "floci-local-secret"
      AWS_DEFAULT_REGION: us-east-1
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_ENDPOINT_URL: http://localhost:4566
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Verify Terraform and AWS CLI
        shell: bash
        run: |
          set -euo pipefail
          terraform version
          if ! command -v aws >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y awscli
          fi
          aws --version
          docker version

      - name: Floci stage — start local AWS emulator
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach             --name floci             --publish 127.0.0.1:4566:4566             --volume /var/run/docker.sock:/var/run/docker.sock             --env FLOCI_RUN_AS_ROOT=true             --env FLOCI_DEFAULT_REGION=us-east-1             --env FLOCI_STORAGE_MODE=memory             floci/floci:2.4.0

      - name: Floci stage — wait for readiness
        shell: bash
        run: |
          set -euo pipefail
          ready=false
          for attempt in $(seq 1 60); do
            if curl --fail --silent --show-error               http://127.0.0.1:4566/_localstack/health               --output "$RUNNER_TEMP/floci-health.json"; then
              cat "$RUNNER_TEMP/floci-health.json"
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            docker logs floci
            echo "Floci did not become ready on localhost:4566." >&2
            exit 1
          fi

      - name: Floci stage — verify dummy identity and bootstrap remote state
        shell: bash
        run: |
          set -euo pipefail
          aws sts get-caller-identity --endpoint-url "$AWS_ENDPOINT_URL"

          aws s3api create-bucket             --bucket floci-tfstate-bu-12345678901             --endpoint-url "$AWS_ENDPOINT_URL"

          aws dynamodb create-table             --table-name tflock             --attribute-definitions AttributeName=LockID,AttributeType=S             --key-schema AttributeName=LockID,KeyType=HASH             --billing-mode PAY_PER_REQUEST             --endpoint-url "$AWS_ENDPOINT_URL"

          aws dynamodb wait table-exists             --table-name tflock             --endpoint-url "$AWS_ENDPOINT_URL"

      - name: Terraform stage — formatting
        run: terraform fmt -check -recursive terraform

      - name: Terraform stage — initialize Floci S3 backend
        working-directory: terraform/BU-12345678901/dev/us-east-1/vpc
        run: terraform init -input=false -no-color -reconfigure

      - name: Terraform stage — validate
        working-directory: terraform/BU-12345678901/dev/us-east-1/vpc
        run: terraform validate -no-color

      - name: Terraform stage — plan only
        working-directory: terraform/BU-12345678901/dev/us-east-1/vpc
        run: |
          set -euo pipefail
          terraform plan -input=false -no-color -lock-timeout=2m -out="$RUNNER_TEMP/bu-vpc.tfplan"
          terraform show -no-color "$RUNNER_TEMP/bu-vpc.tfplan"

      - name: Floci diagnostics
        if: always()
        run: |
          docker logs floci 2>&1 | tail -n 200 || true
          docker rm --force floci || true
