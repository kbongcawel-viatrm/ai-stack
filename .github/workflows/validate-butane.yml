name: validate-butane

# Renders fcos-kasm-platform Butane modules across feature-flag profiles and
# asserts the merged Ignition config is valid JSON. Render-only — no VM, no
# secrets required (dummy identity values are fine for transpilation).

on:
  push:
    paths:
      - 'fcos-kasm-platform/**'
      - '.github/workflows/validate-butane.yml'
  pull_request:
    paths:
      - 'fcos-kasm-platform/**'
      - '.github/workflows/validate-butane.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [full-dhcp, full-static, kasm-only]
    defaults:
      run:
        working-directory: fcos-kasm-platform
    steps:
      - uses: actions/checkout@v4

      - name: Set up Ansible
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --upgrade pip ansible-core
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Install butane
        run: |
          BUTANE_VERSION=0.23.0
          curl -fsSL -o "$RUNNER_TEMP/butane" \
            "https://github.com/coreos/butane/releases/download/v${BUTANE_VERSION}/butane-x86_64-unknown-linux-gnu"
          chmod 0755 "$RUNNER_TEMP/butane"
          "$RUNNER_TEMP/butane" --version
          echo "BUTANE=$RUNNER_TEMP/butane" >> "$GITHUB_ENV"

      - name: Render Ignition (${ profile })
        env:
          # Dummy render inputs — structure is validated, not the values.
          FCOS_SSH_PUBLIC_KEY: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPlaceholderKeyForCIValidationOnly ci-validation"
          FCOS_CORE_PASSWORD_HASH: "$6$rounds=656000$placeholder$placeholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholderplaceholder"
        run: >-
          ansible-playbook -i inventory.ini site.yml
          --tags render
          -e @profiles/${{ matrix.profile }}.yml

      - name: Show rendered artifact summary
        if: always()
        run: |
          if [ -f build/config.ign ]; then
            python3 -m json.tool build/config.ign > /dev/null && echo "config.ign: valid JSON"
            python3 - <<'PY'
          import json
d = json.load(open('build/config.ign'))
files = d.get('storage', {}).get('files', [])
units = d.get('systemd', {}).get('units', [])
print(f"storage.files: {len(files)}  systemd.units: {len(units)}")
PY
          else
            echo "build/config.ign missing"
          fi
