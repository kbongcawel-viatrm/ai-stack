name: Validate Diskless Infrastructure

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "diskless-os/**"
      - ".github/workflows/validate-diskless.yml"
  pull_request:
    paths:
      - "diskless-os/**"
      - ".github/workflows/validate-diskless.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate FCOS Butane and Ignition
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gettext-base
          ssh-keygen -q -t ed25519 -N '' -f /tmp/fcos-validation-key
          export FCOS_SSH_PUBLIC_KEY="$(cat /tmp/fcos-validation-key.pub)"
          export FCOS_LAN_IP="192.168.1.20"
          export FCOS_LAN_CIDR="192.168.1.0/24"
          export FCOS_GATEWAY="192.168.1.1"
          export FCOS_INTERFACE="enp1s0"
          envsubst '${FCOS_SSH_PUBLIC_KEY} ${FCOS_LAN_IP} ${FCOS_LAN_CIDR} ${FCOS_GATEWAY} ${FCOS_INTERFACE}' \
            < diskless-os/butane/fcos.bu > /tmp/fcos.bu
          docker run --rm -i quay.io/coreos/butane:release --strict --pretty \
            < /tmp/fcos.bu > /tmp/fcos.ign
          jq -e '.ignition.version and (.systemd.units | type == "array")' /tmp/fcos.ign >/dev/null

      - name: Install Ansible validators
        run: |
          python3 -m venv "$RUNNER_TEMP/ansible-venv"
          "$RUNNER_TEMP/ansible-venv/bin/pip" install --upgrade pip ansible-core yamllint
          echo "$RUNNER_TEMP/ansible-venv/bin" >> "$GITHUB_PATH"

      - name: Validate Ansible YAML and syntax
        shell: bash
        run: |
          set -euo pipefail
          yamllint -d relaxed diskless-os/ansible
          while IFS= read -r playbook; do
            ansible-playbook --syntax-check -i localhost, "$playbook"
          done < <(find diskless-os/ansible/playbooks -maxdepth 1 -type f -name '*.yml' -print 2>/dev/null | sort)

      - name: Validate shell scripts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find diskless-os -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
