name: Validate AI Stack Bootstrapping

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        name: Checkout
      - name: Validate installer syntax
        shell: bash
        run: |
          if bash -n scripts/install-ai-tools.sh scripts/test-install-ai-tools.sh; then
            echo "Installed"
          else
            echo "Installer syntax validation failed" >&2
            exit 1
          fi
      - name: Validate session scripts syntax
        run: |
          if bash -n scripts/new-session-doc.sh scripts/test-new-session-doc.sh scripts/resume-session.sh scripts/test-resume-session.sh; then
            echo "Syntax validation successful."
          else
            echo "Syntax validation failed." >&2
            exit 1
          fi
      - name: Run boostrap checks
        run: |
          if bash -n scripts/test-install-ai-tools.sh bash scripts/test-install-ai-tools.sh; then
             echo "Passed"
          else
            echo "Failed" >&2
            exit 1
          fi
          if bash -n scripts/test-new-session-doc.sh bash scripts/test-new-session-doc.sh; then
             echo "Passed"
          else
            echo "Failed" >&2
            exit 1
          fi
          if bash -n scripts/test-resume-session.sh bash scripts/test-resume-session.sh; then
             echo "Passed"
          else
            echo "Failed" >&2
            exit 1
          fi
      - name: Validate MCP JSON
        run: |
          if python -m json.tool .cline/mcp.json >/dev/null; then
          echo "MCP validated"
            else
          echo "MCP validation failed" >&2
            exit 1
          fi
      - name: Check required files
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .agents/rules/working-agreement.md \
            .agents/providers/cline-api.md \
            .agents/providers/cline-cli.md \
            .agents/providers/linear.md \
            .agents/skills/api-provider-setup/SKILL.md \
            .agents/skills/session-resume/SKILL.md \
            .cline/skills/session-resume/SKILL.md \
            .agents/sessions/templates/HANDOFF.md \
            .cline/mcp.json \
            .clinerules/00-project.md \
            test -s "$path" || { echo "Missing required file: $path" >&2; exit 1; }
          done
