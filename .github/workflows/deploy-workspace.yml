name: Deploy AI Workspace Bootstrapping

on:
  workflow_run:
    workflows:
      - "Validate AI Stack Bootstrapping"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: [self-hosted, toolbox]

    defaults:
      run:
        shell: bash

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
      COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:
      - name: Launch floci
        run: |
          set -euo pipefail
          tcat() {
          if [[ ! -w /dev/tty ]]; then
              printf 'Error: No writable terminal available.\n' >&2
              return 1
          fi
          command cat -- "$@" > /dev/tty
          }
          
          _terminal_msg() {
              local status="$1"
              shift

              local color
              case "$status" in
                  success) color='1;32' ;;  # Bold, default Green
                  error)   color='1;31' ;;  # Bold, default Red
                  warning) color='1;33' ;;  # Bold, default Yellow
                  normal)  color='1'  ;;  # Bold, default foreground color
                  *)       color='0'  ;;  # Default/reset
              esac
              printf '\033[%sm%s\033[0m\n' "$color" "$*" | tcat
          }

          if podman container exists floci; then
             _terminal_msg success " Container floci exists 🚀 Yuhow! "
          else
             _terminal_msg error " Container floci does not exist yet. Create it first 💢 "
             podman-compose -f compose.yaml up -d
             sleep 2
             curl -s -o /dev/null -w "%{http_code}" http://localhost:4566 | grep -q "200" && \
             _terminal_msg success normal "Healthy 🚀" || echo "Unhealthy 💢"

      - name: Checkout Code
        uses: actions/checkout@v4
    
      - name: Move Scripts to Home Directory
        run: |
          mkdir -p "$HOME/workspace/ai-stack"
          cp -r ./* "$HOME/workspace/ai-stack"
          
