
name: Deploy AI Workspace Bootstrapping

on:
  workflow_run:
    workflows:
      - "Validate AI Stack Bootstrapping"
    types:
      - completed

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, toolbox]

    defaults:
      run:
        shell: bash

    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    env:
      REPOSITORY: ${{ github.server_url }}/${{ github.repository }}.git
      COMMIT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

    steps:

      # --------------------------------------------------
      # 1. Checkout Repository
      # --------------------------------------------------
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}
          persist-credentials: false

      # --------------------------------------------------
      # 2. Launch Floci
      # --------------------------------------------------
      - name: Launch Floci
        run: |
          set -euo pipefail

          if ! command -v podman-compose >/dev/null 2>&1; then
              echo "::error::podman-compose is not installed"
              exit 1
          fi

          if podman container exists floci; then

              STATUS=$(podman inspect \
                  --format '{{.State.Status}}' floci)

              if [[ "$STATUS" == "running" ]]; then
                  echo "::notice::Container floci already exists and is running."

              else
                  echo "::warning::Container floci exists but is not running."
                  podman start floci
              fi

          else

              echo "::notice::Container floci does not exist. Creating it."

              podman-compose -f ~/workspace/floci/compose.yaml up -d

          fi

      # --------------------------------------------------
      # 3. Verify Floci Health
      # --------------------------------------------------
      - name: Verify Floci Health
        run: |
          set -euo pipefail

          echo "Checking Floci availability..."

          for attempt in $(seq 1 30); do

              HTTP_CODE=$(
                  curl -sS \
                      -o /dev/null \
                      -w '%{http_code}' \
                      --max-time 5 \
                      http://localhost:4566 || true
              )

              if [[ "$HTTP_CODE" == "200" ]]; then
                  echo "::notice::Floci is healthy. HTTP $HTTP_CODE"
                  exit 0
              fi

              echo "Attempt $attempt/30 - HTTP $HTTP_CODE"
              sleep 2

          done

          echo "::error::Floci health check failed."

          podman logs --tail 100 floci || true

          exit 1

      # --------------------------------------------------
      # 4. Move Repository to Home Directory
      # --------------------------------------------------
      - name: Move Scripts to Home Directory
        run: |
          set -euo pipefail

          DEST="$HOME/workspace/ai-stack"

          mkdir -p "$DEST"

          tar --exclude=.git \
              -C "$GITHUB_WORKSPACE" \
              -cf - . | tar -C "$DEST" -xf -

          echo "=== Deployment Workspace ==="
          ls -lah "$DEST"

