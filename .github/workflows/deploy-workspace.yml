name: Deploy AI Workspace Bootstrapping

on:
  workflow_run:
    workflows: ["Validate AI Stack Bootstrapping"]
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  deploy:
    runs-on: [self-hosted, toolbox]
    defaults:
      run:
        shell: bash -ieo pipefail {0}
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Source bashrc
        run: |
          if [[ $- == *i* ]]; then
             source "$HOME/.bashrc"
          fi
          tbver=$(toolbox -v)
          if [ $tbver /dev/null ]; then
             echo "Toolbox is running $tbver"
          
      - name: Enter Toolbox floci
        run: |
          toolbox create \
              --container floci \
              --image registry.fedoraproject.org/fedora-toolbox:latest
          toolbox enter floci
          sudo dnf clean all \
          && sudo dnf makecache \
          && sudo dnf upgrade -y --skip-unavailable \
          && sudo dnf install podman-compose -y
          
      - name: Setup Floci
        run: |
          if [ ! -d ~/workspace/floci ]; then
             mkdir -p ~/workspace/floci
          fi
          
          cd ~/workspace/floci
          podman-compose -f compose.yaml up -d
          podman ps --filter name=floci
          podman logs -f floci
          [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4566)" -eq 200 ] \
          && echo "OK"
