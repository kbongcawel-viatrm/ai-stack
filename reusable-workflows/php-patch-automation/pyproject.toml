[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "php-patch-automation"
version = "0.1.0"
description = "Ansible-free multi-cloud PHP patch discovery and orchestration toolkit"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
azure = ["azure-identity>=1.17,<2", "azure-mgmt-resourcegraph>=8,<9"]
all-clouds = ["boto3>=1.34,<2", "azure-identity>=1.17,<2", "azure-mgmt-resourcegraph>=8,<9"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.5,<1", "mypy>=1.10,<2", "types-PyYAML>=6.0"]

[project.scripts]
php-patch = "php_patch.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/php_patch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
