name: CI
on:
  pull_request:
    paths: ["reusable-workflows/php-patch-automation/**"]
  push:
    branches: [main]
    paths: ["reusable-workflows/php-patch-automation/**"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: php-patch-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reusable-workflows/php-patch-automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reusable-workflows/php-patch-automation/pyproject.toml
      - run: python -m pip install -e '.[dev,all-clouds]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=php_patch --cov-report=term-missing
      - run: php-patch validate-policy --policy config/php-policy.yml
